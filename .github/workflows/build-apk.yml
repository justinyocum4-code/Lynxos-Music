name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        default: '2.2.79'
      version_code:
        description: 'Version code (whole number, bump every build)'
        required: false
        default: '143'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'First release'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="lynxos-music-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the Lynxos Music app file (lynxos-music-app marker missing)."
            exit 1
          fi

          mkdir -p app/src/main/java/com/lynxosmusic/app app/src/main/assets/www app/src/main/python
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          # v2.2.30: Python bridge for YouTube Music (Chaquopy + ytmusicapi)
          if [ -f python/ytm_bridge.py ]; then
            cp python/ytm_bridge.py app/src/main/python/ytm_bridge.py
            echo "Python bridge installed."
          else
            echo "WARNING: python/ytm_bridge.py not found; Python bridge skipped."
          fi

          # TV (Leanback) banner so the app shows in the TV launcher row.
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found in repo root; TV banner skipped."
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "LynxosMusicApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'com.chaquo.python' version '16.1.0' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.lynxosmusic.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lynxosmusic.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          chaquopy {
              defaultConfig {
                  version "3.10"
                  pip {
                      install "ytmusicapi==1.12.3"
                      install "yt-dlp"
                  }
              }
          }
          dependencies {
              // Native audio engine (v1.9): ExoPlayer plays the music, the
              // NewPipe extractor resolves YouTube audio streams. Both are
              // established open-source libraries.
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              /* v2.2.7: media session for Bluetooth headset buttons. */
              implementation 'androidx.media3:media3-session:1.4.1'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
              /* v2.2.92: FileProvider for the in-app updater. */
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- v1.9 native audio: keep music playing with the screen off -->
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <!-- v2.2.100: the playback service holds its own Wi-Fi lock across track boundaries so the next song can resolve + buffer with the screen off -->
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <!-- v2.2.13: allow asking the system to exempt the app from battery optimization so screen-off playback isn't killed after 10-15 min -->
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <!-- v2.2.92: in-app updater needs to install APK packages -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="Lynxos Music"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.lynxosmusic.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <!-- v2.2.69: OAuth deep link for Google sign-in -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.lynxosmusic.app" android:host="auth-callback" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.lynxosmusic.app.MusicService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <!-- v2.2.92: FileProvider for the in-app updater's APK install -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.lynxosmusic.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="updates/" />
          </paths>
          EOF

          cat > app/src/main/java/com/lynxosmusic/app/MainActivity.java <<'EOF'
          package com.lynxosmusic.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.view.KeyEvent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import org.json.JSONObject;
          /* v2.2.30: Chaquopy Python bridge for YouTube Music */
          import com.chaquo.python.Python;
          import com.chaquo.python.PyObject;
          import com.chaquo.python.android.AndroidPlatform;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean backArmed = false;
              // The page loads under a real https origin so the YouTube iframe
              // player gets a valid referrer/origin. file:// gives it nothing,
              // and rights-restricted music videos refuse inline playback,
              // showing "Watch on YouTube" instead.
              private static final String BASE_URL = "https://lynxosmusic.app/";
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int NOTIF_PERMISSION_REQUEST = 1002;
              private ValueCallback<Uri[]> filePathCallback;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private MusicService musicService;
              private boolean svcBound = false;
              private boolean pageAlive = false;
              private Runnable pendingSvcAction;

              private final ServiceConnection svcConn = new ServiceConnection() {
                  @Override public void onServiceConnected(ComponentName name, IBinder binder) {
                      musicService = ((MusicService.LocalBinder) binder).getService();
                      try { musicService.setUiListener(svcListener); } catch (Exception ignored) {}
                      svcBound = true;
                      if (pendingSvcAction != null) {
                          final Runnable r = pendingSvcAction;
                          pendingSvcAction = null;
                          mainHandler.post(r);
                      }
                  }
                  @Override public void onServiceDisconnected(ComponentName name) {
                      if (musicService != null) {
                          try { musicService.setUiListener(null); } catch (Exception ignored) {}
                      }
                      musicService = null;
                      svcBound = false;
                  }
              };

              // Forward a JavaScript call to the music service, binding first if needed.
              private void withService(final Runnable r) {
                  if (svcBound && musicService != null) {
                      mainHandler.post(r);
                      return;
                  }
                  pendingSvcAction = r;
                  try {
                      Intent svc = new Intent(this, MusicService.class);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc);
                      else startService(svc);
                      bindService(svc, svcConn, Context.BIND_AUTO_CREATE);
                  } catch (Exception ignored) {}
              }

              // Events coming back from the music service into the web page.
              private final MusicService.UiListener svcListener = new MusicService.UiListener() {
                  private void js(final String code) {
                      mainHandler.post(new Runnable() {
                          @Override public void run() {
                              try { if (webView != null) webView.evaluateJavascript(code, null); }
                              catch (Exception ignored) {}
                          }
                      });
                  }
                  @Override public void onTrackChanged(int index) {
                      js("window.lmNativeTrack&&window.lmNativeTrack(" + index + ")");
                  }
                  @Override public void onProgress(int posSec, int durSec, boolean playing) {
                      js("window.lmNativeProgress&&window.lmNativeProgress(" + posSec + "," + durSec + "," + (playing ? "true" : "false") + ")");
                  }
                  @Override public void onTrackError(String msg) {
                      js("window.lmNativeError&&window.lmNativeError(" + JSONObject.quote(msg == null ? "" : msg) + ")");
                  }
                  @Override public boolean onTrackResolveFailed(final int index, final int kind, final String message) {
                      if (!pageAlive) return false;
                      /* v2.2.98: forward the failure kind ("dead"/"transient")
                         and message to the page's resolve-failure handler. */
                      String kindStr = (kind == MusicService.KIND_DEAD) ? "dead" : "transient";
                      js("window.lmNativeResolveFailed&&window.lmNativeResolveFailed(" + index + "," + JSONObject.quote(kindStr) + "," + JSONObject.quote(message == null ? "" : message) + ")");
                      return true;
                  }
                  @Override public void onTrackResolved(final int index, final String resolvedVideoId) {
                      if (!pageAlive) return;
                      js("window.lmNativeResolved&&window.lmNativeResolved(" + index + "," + JSONObject.quote(resolvedVideoId == null ? "" : resolvedVideoId) + ")");
                  }
                  @Override public void onTrackEnded() {
                      js("window.lmNativeEnded&&window.lmNativeEnded()");
                  }
                  @Override public boolean onNotifToggle() {
                      if (!pageAlive) return false;
                      js("(function(){try{togglePlayPause()}catch(e){}}())");
                      return true;
                  }
                  @Override public boolean onNotifNext() {
                      if (!pageAlive) return false;
                      js("(function(){try{playNext(false)}catch(e){}}())");
                      return true;
                  }
                  @Override public boolean onNotifPrev() {
                      if (!pageAlive) return false;
                      js("(function(){try{playPrev()}catch(e){}}())");
                      return true;
                  }
              };

              // Called from JavaScript as LynxosPlayer.* — the native audio engine
              // (v1.9). Plays through ExoPlayer in a foreground service so music
              // keeps going with the screen off.
              /* v2.2.30: YouTube Music bridge — calls Python ytmusicapi via Chaquopy.
                 JavaScript calls LynxosYTM.* methods. */
              /* v2.2.33: Shared YTMusicBridge instance for MusicService access. */
              public static YTMusicBridge sharedYtmBridge = null;
              /* v2.2.92: in-app updater — downloads the latest APK and fires the
                 system installer, so updates happen in place without reinstalling. */
              public class UpdateBridge {
                  private void jsStatus(final String s){
                      final String esc = s.replace("\\", "\\\\").replace("'", "\\'");
                      webView.post(new Runnable() {
                          @Override public void run() {
                              webView.evaluateJavascript(
                                  "(function(){ try { if(window.onUpdateStatus) window.onUpdateStatus('" + esc + "'); } catch(e){} })()", null);
                          }
                      });
                  }
                  @JavascriptInterface public int getVersionCode(){
                      try {
                          if(Build.VERSION.SDK_INT >= 28){
                              return (int) getPackageManager().getPackageInfo(getPackageName(), 0).getLongVersionCode();
                          } else {
                              return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                          }
                      } catch(Exception e){ return 0; }
                  }
                  @JavascriptInterface public void downloadAndInstall(final String url){
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  jsStatus("downloading");
                                  java.net.URL u = new java.net.URL(url);
                                  java.net.HttpURLConnection c = (java.net.HttpURLConnection) u.openConnection();
                                  c.setConnectTimeout(30000); c.setReadTimeout(60000);
                                  c.setRequestProperty("User-Agent", "LynxosMusicUpdater");
                                  c.connect();
                                  int total = c.getContentLength();
                                  long done = 0;
                                  java.io.File dir = new java.io.File(getExternalFilesDir(null), "updates");
                                  if(!dir.exists()) dir.mkdirs();
                                  java.io.File out = new java.io.File(dir, "update.apk");
                                  java.io.InputStream in = c.getInputStream();
                                  java.io.FileOutputStream fos = new java.io.FileOutputStream(out);
                                  byte[] buf = new byte[8192]; int n; int lastPct = -1;
                                  while((n = in.read(buf)) != -1){
                                      fos.write(buf, 0, n); done += n;
                                      if(total > 0){
                                          int pct = (int)(done * 100 / total);
                                          if(pct != lastPct){ lastPct = pct; jsStatus("downloading:" + pct); }
                                      }
                                  }
                                  fos.close(); in.close();
                                  jsStatus("installing");
                                  android.net.Uri uri = androidx.core.content.FileProvider.getUriForFile(
                                      MainActivity.this, getPackageName() + ".fileprovider", out);
                                  Intent intent = new Intent(Intent.ACTION_VIEW);
                                  intent.setDataAndType(uri, "application/vnd.android.package-archive");
                                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  /* Android 8+: the app must be allowed to install unknown apps. */
                                  if(Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()){
                                      Intent s = new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          android.net.Uri.parse("package:" + getPackageName()));
                                      s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(s);
                                      jsStatus("need_permission");
                                      return;
                                  }
                                  startActivity(intent);
                                  jsStatus("launched");
                              } catch(Exception e){
                                  jsStatus("error: " + e.getMessage());
                              }
                          }
                      }).start();
                  }
              }
              public class YTMusicBridge {
                  private PyObject ytmModule = null;
                  public void warmup() {
                      /* v2.2.72: Called once at startup to boot Python early. */
                      ensurePython();
                  }
                  private void ensurePython() {
                      try {
                          if (!Python.isStarted()) {
                              Python.start(new AndroidPlatform(MainActivity.this));
                          }
                          if (ytmModule == null) {
                              ytmModule = Python.getInstance().getModule("ytm_bridge");
                          }
                      } catch (Exception e) {
                          android.util.Log.e("LynxosYTM", "Python init failed", e);
                      }
                  }
                  /* v2.2.33: Instance method for MusicService to get stream URL via Python yt-dlp. */
                  public String getStreamUrlViaPython(String videoId) {
                      try {
                          ensurePython();
                          if (ytmModule != null) {
                              PyObject r = ytmModule.callAttr("get_stream_url", videoId);
                              String json = r.toString();
                              if (json != null && json.contains("\"url\"")) {
                                  int start = json.indexOf("\"url\"") + 7;
                                  int end = json.indexOf("\"", start);
                                  if (start > 6 && end > start) {
                                      String url = json.substring(start, end);
                                      if (url != null && !url.isEmpty() && url.startsWith("http")) {
                                          return url;
                                      }
                                  }
                              }
                          }
                      } catch (Exception e) {
                          android.util.Log.w("LynxosYTM", "Python stream URL failed", e);
                      }
                      return null;
                  }
                  @JavascriptInterface public String searchSongs(final String query, final int maxResults) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("search_songs", query, maxResults);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "searchSongs failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception e) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getRadio(final String videoId, final int limit) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_radio", videoId, limit);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getRadio failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception e) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getArtistInfo(final String artistId) {
                      final String[] result = new String[1];
                      result[0] = "{}";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_artist_info", artistId);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getArtistInfo failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception ignored) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getArtistAlbums(final String artistId) {
                      final String[] result = new String[1];
                      result[0] = "{\"albums\":[],\"singles\":[]}";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_artist_albums", artistId);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getArtistAlbums failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception ignored) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getArtistTopSongs(final String artistId, final int limit) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_artist_top_songs", artistId, limit);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getArtistTopSongs failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception ignored) {}
                      return result[0];
                  }
                  @JavascriptInterface public String searchArtists(final String query, final int limit) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("search_artists", query, limit);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "searchArtists failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception e) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getMoodGenreCategories() {
                      final String[] result = new String[1];
                      result[0] = "{}";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_mood_genre_categories");
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getMoodGenreCategories failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(15000); } catch (Exception e) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getMoodPlaylists(final String params, final int limit) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_mood_playlists", params, limit);
                                      result[0] = r.toString();
                                  }
                              } catch (Exception e) {
                                  android.util.Log.e("LynxosYTM", "getMoodPlaylists failed", e);
                              }
                          }
                      });
                      t.start();
                      try { t.join(20000); } catch (Exception e) {}
                      return result[0];
                  }
                  @JavascriptInterface public String getYtmLiked(final String token, final int limit) {
                      final String[] result = new String[1];
                      result[0] = "[]";
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ensurePython();
                                  if (ytmModule != null) {
                                      PyObject r = ytmModule.callAttr("get_ytm_liked", token, limit);
                                      result[0] = r.toString();
