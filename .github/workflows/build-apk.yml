                      final long[] lastCmdAt = new long[] { 0 };
                      final int[] lastCmdDir = new int[] { 0 };
                      MediaSession.Builder sessionBuilder = new MediaSession.Builder(this, player)
                          .setCallback(new MediaSession.Callback() {
                              @Override
                              public boolean onMediaButtonEvent(
                                      MediaSession session, MediaSession.ControllerInfo controllerInfo,
                                      Intent mediaButtonEvent) {
                                  /* v2.2.10: handle headset next/prev via media button
                                     events — avoids the ConnectionResult constructor
                                     that varies by media3 version.
                                     v2.2.104: the tail of this method is restructured
                                     so the ONLY way to reach the super (media3
                                     default handling) return is the logged
                                     fall-through at the bottom — every ACTION_DOWN
                                     media keycode is consumed by a branch above. */
