              static void diagLog(Context ctx, String event) {
                  try {
                      if (ctx == null || event == null) return;
                      synchronized (DIAG_LOCK) {
                          android.content.SharedPreferences sp =
                                  ctx.getSharedPreferences(DIAG_PREFS, Context.MODE_PRIVATE);
                          String old = sp.getString("entries", "");
                          String ts = new java.text.SimpleDateFormat("HH:mm:ss", java.util.Locale.US)
                                  .format(new java.util.Date());
                          String line = ts + " " + event;
                          String all = (old == null || old.isEmpty()) ? line : old + "\n" + line;
                          String[] parts = all.split("\n");
                          if (parts.length > DIAG_MAX) {
                              StringBuilder sb = new StringBuilder();
                              for (int k = parts.length - DIAG_MAX; k < parts.length; k++) {
                                  if (sb.length() > 0) sb.append('\n');
                                  sb.append(parts[k]);
                              }
                              all = sb.toString();
                          }
                          sp.edit().putString("entries", all).apply();
                      }
                  } catch (Throwable ignored) {}
              }
