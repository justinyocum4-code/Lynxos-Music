              public class AudioBridge {
                  /* v2.2.118: spoken karaoke lines — android.speech.tts.TextToSpeech,
                     STREAM_MUSIC, QUEUE_FLUSH per line so lines never pile up, lazy
                     init, latest-only pending text until onInit. Page-side this is
                     gated by the opt-in speak-lyrics toggle (default OFF); TTS talks
                     over the music (no ducking in this build) — that is why it is
                     opt-in. */
                  private android.speech.tts.TextToSpeech lyricTts = null;
                  private volatile boolean lyricTtsReady = false;
                  private volatile String lyricTtsPending = null;

                  @android.webkit.JavascriptInterface
                  public void speak(String text) {
                      if (text == null) return;
                      final String line = text.trim();
                      if (line.isEmpty()) return;
                      try {
                          if (lyricTts == null) {
                              lyricTtsPending = line;
                              lyricTts = new android.speech.tts.TextToSpeech(MainActivity.this, new android.speech.tts.TextToSpeech.OnInitListener() {
                                  @Override public void onInit(int status) {
                                      lyricTtsReady = (status == android.speech.tts.TextToSpeech.SUCCESS);
                                      if (lyricTtsReady) {
                                          String p = lyricTtsPending;
                                          lyricTtsPending = null;
                                          if (p != null) speakNow(p);
                                      }
                                  }
                              });
                              return;
                          }
                          if (!lyricTtsReady) { lyricTtsPending = line; return; }
                          speakNow(line);
                      } catch (Exception ignored) {}
                  }

                  private void speakNow(String line) {
                      try {
                          android.os.Bundle params = new android.os.Bundle();
                          params.putInt(android.speech.tts.TextToSpeech.Engine.KEY_PARAM_STREAM, android.media.AudioManager.STREAM_MUSIC);
                          lyricTts.speak(line, android.speech.tts.TextToSpeech.QUEUE_FLUSH, params, "lyric-line");
                      } catch (Exception ignored) {}
                  }

                  public void shutdownTts() {
                      try {
                          if (lyricTts != null) { lyricTts.stop(); lyricTts.shutdown(); lyricTts = null; }
                          lyricTtsReady = false;
                          lyricTtsPending = null;
                      } catch (Exception ignored) {}
                  }
