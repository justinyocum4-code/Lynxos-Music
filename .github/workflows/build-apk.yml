                                                      lastBtNavTime[0] = nowB;
                                                      main.post(new Runnable() {
                                                          @Override public void run() {
                                                              UiListener l = ui;
                                                              boolean consumed = false;
                                                              if (l != null) { try { consumed = l.onNotifPrev(); } catch (Exception ignored) {} }
                                                              if (!consumed) playAtInternal(currentIndex - 1);
                                                          }
                                                      });
                                                  }
                                                  return true;
                                              }
                                              /* v2.2.104: the play/pause family — PLAY,
                                                 PAUSE, PLAY_PAUSE and HEADSETHOOK — now
                                                 shares ONE direction gate (the audit's
                                                 second conviction: through v2.2.103 the
                                                 explicit PLAY/PAUSE branches touched NO
                                                 debounce clock, so an AVRCP PAUSE->PLAY
                                                 pair executed in full at ANY spacing —
                                                 same-direction duplicates are indeed
                                                 harmless, direction pairs are not).
                                                 PLAY is play-ward, PAUSE is pause-ward;
                                                 the two toggles take the direction they
                                                 would move playback from the state at
                                                 press time. A press REVERSING the last
                                                 executed direction within 800 ms is the
                                                 echo of the same physical press:
                                                 consumed, logged, NOT executed, and the
                                                 gate is NOT restamped (the window stays
                                                 anchored to the real press). Same-
                                                 direction repeats EXECUTE (documented
                                                 choice: play/pause are idempotent, and
                                                 a repeated toggle is indistinguishable
                                                 from a deliberate fast double-press).
                                                 Every execution restamps the gate.
                                                 HEADSETHOOK — the standard single-button
                                                 headset gesture — is handled here for
                                                 the first time; through v2.2.103 it fell
                                                 through to media3 default handling,
                                                 which toggled the player unlogged.
                                                 (v2.2.99's explicit PLAY/PAUSE semantics
                                                 are kept: PLAY and PAUSE themselves
                                                 still never toggle.) */
                                              if (kc == KeyEvent.KEYCODE_MEDIA_PLAY
                                                      || kc == KeyEvent.KEYCODE_MEDIA_PAUSE
                                                      || kc == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                                                      || kc == KeyEvent.KEYCODE_HEADSETHOOK) {
                                                  final int dir;
                                                  final Runnable action;
                                                  if (kc == KeyEvent.KEYCODE_MEDIA_PLAY) {
                                                      dir = 1;
                                                      action = new Runnable() {
                                                          @Override public void run() { playOnlyInternal("bt/session"); }
                                                      };
                                                  } else if (kc == KeyEvent.KEYCODE_MEDIA_PAUSE) {
                                                      dir = -1;
                                                      action = new Runnable() {
                                                          @Override public void run() { pauseOnlyInternal("bt/session"); }
                                                      };
                                                  } else {
                                                      boolean playingNow = false;
                                                      try { playingNow = player != null && player.getPlayWhenReady(); } catch (Exception ignored) {}
