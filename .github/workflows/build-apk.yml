                 single listening session and well inside googlevideo URL lifetimes;
                 a skip after a longer pause falls back to a fresh resolve. */
              private static final long PRELOAD_ADOPT_MAX_AGE_MS = 30L * 60L * 1000L;
              private volatile long landingPlayGen = -1;
              private volatile int autoAdvancedIndex = -1;
              private volatile long autoAdvancedGen = -1;
              private UiListener ui;
              /* v2.2.102: previous playback state, so the player listener
                 can log STATE_BUFFERING exits (see onPlaybackStateChanged). */
              private int lastPlaybackState = Player.STATE_IDLE;
              /* v2.2.5: native repeat mode (0=off, 1=all, 2=one), set by the web page. */
              private int repeatMode = 0;

              private final Runnable progressTick = new Runnable() {
                  @Override public void run() {
                      boolean playing = false;
                      try { playing = player != null && player.isPlaying(); } catch (Exception ignored) {}
                      /* v2.2.110: snapshot the player's buffered-ahead for
                         the banking yield policy. Player reads stay on this
                         (main) thread; the banking worker only reads these
                         volatiles, so the yield check never touches the
                         player off-thread. */
                      try {
                          if (player != null) {
                              bankBufferedAheadMs = Math.max(0L,
                                  player.getBufferedPosition() - player.getCurrentPosition());
                              bankPlayerWants = player.getPlayWhenReady();
                          } else {
                              bankBufferedAheadMs = 0;
                              bankPlayerWants = false;
                          }
                      } catch (Exception ignored) {}
                      /* v2.1.6: don't churn the CPU every second when paused or
                         idle — tick rarely just to keep the UI honest. */
                      if (playing) pushProgress();
                      main.postDelayed(this, playing ? 1000 : 5000);
                  }
              };

              // ---- v2.2.110: download-and-bank ----
              /* The rebuild the v2.2.109 failure pointed to. media3's
                 playlist preload is best-effort behind the current item's
                 needs in the shared buffer, so on this connection the
                 preloaded next track held ~0 bytes when a skip landed on
                 it. Instead, upcoming tracks are banked to DISK, fully,
                 ahead of time:
                 - initMediaCache builds ONE SimpleCache (128 MB LRU, app
                   cache dir). The player is built with a CacheDataSource
                   over it (read/write-through, FLAG_IGNORE_CACHE_ON_ERROR
                   only — the player never blocks behind the banking
                   writer; the block-on-cache flag is never set), keyed by a
                   CacheKeyFactory that maps each stream URL back to its
                   videoId, so every item addresses the cache as
                   "lmv2_" + videoId no matter which expiring URL a resolve
                   handed out (v2.2.129: plus the session-cap suffix when capped below 160 — see cacheKeyFor). The banking writer sets the same key
                   explicitly on its DataSpec (cacheKeyFor — one
                   computation, both paths).
                   v2.2.124: prefix was "lmv_" — bumped to "lmv2_" with the
                   96→160 kbps cap, so repeat plays re-bank at the higher
                   quality instead of serving old ~70 kbps bytes. Old
                   "lmv_" spans orphan until LRU eviction.
                 - The banking worker below (single thread, at most one
                   CacheWriter download at a time; total network users:
                   the player + this writer) works HEAD-FIRST
                   (v2.2.111): phase 1 banks just the first
                   BANK_HEAD_BYTES of each of the next four tracks after
                   the current one, phase 2 fills those tracks to full
                   in the same order. Whole-track-only banking (the
                   v2.2.110 model) lost to a listener skipping faster
                   than a full track downloads — every skip landed on an
                   unbanked song. A head is a fifth of a track, so four
                   heads land in the time one fill took, and a skip onto
                   a head-banked track starts from disk instantly with
                   the head as runway while the rest streams in. Targets
                   always derive from the freshest queue state; any
                   queue-context change bumps bankEpoch and cancels the
                   in-flight writer, and a stale target is abandoned,
                   never finished.
                 - YIELD POLICY: while the player wants to play and its
                   buffered-ahead (snapshotted by progressTick on the main
                   thread) is below 25 s, the writer must not download —
                   checked before each target and inside the writer's
                   progress listener (which cancels the writer; cached
                   spans persist, so resuming continues where it stopped).
                   Only state changes are logged: 'bank yield' /
                   'bank resume'.
                 - Completion is verified before it is claimed: 'bank
                   head idx=<n>' for a head, 'banked idx=<n>' for a full
                   track — each only after CacheWriter.cache() returns
                   (and, when the content length is known, the cached
                   bytes cover the claimed range). Failures log 'bank
                   failed idx=<n>' and are not retried until the next
                   natural trigger (track start, queue push, browse-open
                   signal) starts a fresh pass with fresh failure sets —
                   so a head that fails in one pass never blacklists its
                   track's fill in a later pass.
                 - Browse banking: bankBrowse() hands the worker an
                   opened album's, playlist's, or Liked Songs' first
                   four tracks as a browse context. The worker banks the
                   heads of all four, then fills of the first two only
                   (deeper fills are the play chain's job once playback
                   starts). Browse work is attempted ONLY when the
                   playing queue has nothing left to bank — the playing
                   queue always wins; browse fills an idle worker and
                   never displaces it. */
              private final ExecutorService bankExec = Executors.newSingleThreadExecutor();
              private final java.util.concurrent.atomic.AtomicBoolean bankRunning =
                      new java.util.concurrent.atomic.AtomicBoolean(false);
              private final java.util.concurrent.atomic.AtomicBoolean bankKickPending =
                      new java.util.concurrent.atomic.AtomicBoolean(false);
              private final java.util.concurrent.atomic.AtomicLong bankEpoch =
                      new java.util.concurrent.atomic.AtomicLong(0);
              private volatile CacheWriter bankWriter;
              private volatile long bankBufferedAheadMs = 0;
              private volatile boolean bankPlayerWants = false;
              private volatile boolean bankYielding = false;
              /* v2.2.114: count of play-path resolves in flight
                 (playAtInternal's resolveShared wait, marked there).
                 Play resolves and bank resolves share the resolveExec
                 pool; while a play resolve runs, the bank loop yields
                 before starting each item and bankYieldNow() reports
                 yield, so a bank resolve queued ahead of a tap can't
                 eat the tap's whole deadline on a slow device (the TV
                 "Connection hiccup" mechanism — audit H2). */
              private final java.util.concurrent.atomic.AtomicInteger playResolveInFlight =
                      new java.util.concurrent.atomic.AtomicInteger(0);
              private volatile List<Track> browseBank;

              /* v2.2.111: a "head" is the first BANK_HEAD_BYTES of a
                 track, cached under the track's usual stable key. At the
                 capped ~70 kbps stream weight this is roughly 58 s of
                 audio (512000 bytes x 8 / 70000 bps) — a skip landing on
                 it starts from disk instantly and gets that much runway
                 while the remainder streams in behind it. */
              private static final long BANK_HEAD_BYTES = 512000L;

              private static class BankTarget {
                  final int idx;
                  final String videoId;
                  final String title;
                  final String artist;
                  final boolean browse;
                  final long epoch;
                  /* v2.2.111: true = head item (first BANK_HEAD_BYTES
                     only), false = fill item (the whole track). */
                  final boolean head;
                  BankTarget(int idx, String videoId, String title, String artist, boolean browse, long epoch, boolean head) {
                      this.idx = idx; this.videoId = videoId; this.title = title;
                      this.artist = artist; this.browse = browse; this.epoch = epoch;
                      this.head = head;
                  }
              }

              /* Builds the singleton cache + the player's cache data
                 source factory. Called once from onCreate before the
                 player is built. Any failure leaves both fields null and
                 playback falls back to plain streaming, exactly as
                 before v2.2.110. */
              private synchronized void initMediaCache() {
                  if (mediaCache != null) return;
                  try {
                      File dir = new File(getCacheDir(), "lm_media_cache");
                      SimpleCache sc = new SimpleCache(dir,
                              new LeastRecentlyUsedCacheEvictor(128L * 1024L * 1024L),
                              new StandaloneDatabaseProvider(this));
                      mediaCache = sc;
                      CacheKeyFactory keyFactory = new CacheKeyFactory() {
                          @Override public String buildCacheKey(DataSpec dataSpec) {
                              /* An explicit key (the banking writer's)
                                 wins as-is. The player sets none, so its
                                 items are keyed by the videoId the URL was
                                 resolved for — stable across re-resolves. */
                              if (dataSpec.key != null) return dataSpec.key;
                              String vid = (dataSpec.uri != null) ? videoIdForUrl(String.valueOf(dataSpec.uri)) : null;
                              if (vid != null && !vid.isEmpty()) return cacheKeyFor(vid);
                              return CacheKeyFactory.DEFAULT.buildCacheKey(dataSpec);
                          }
                      };
                      cacheDsFactory = new CacheDataSource.Factory()
                              .setCache(sc)
                              .setUpstreamDataSourceFactory(new DefaultDataSource.Factory(this))
                              .setCacheKeyFactory(keyFactory)
                              .setFlags(CacheDataSource.FLAG_IGNORE_CACHE_ON_ERROR);
                      diag("media cache ready");
                  } catch (Exception e) {
                      mediaCache = null;
                      cacheDsFactory = null;
                      diag("media cache init failed " + shorten(String.valueOf(e)));
                  }
              }

              /* Browse-open signal (page -> AudioBridge.bankBrowse): the
                 first four tracks of an opened album, playlist, or Liked
                 Songs list, as a browse context — NOT a play. Stored
                 capped at four; the worker banks them (heads of all
                 four, then fills of the first two) only when the playing
                 queue leaves it idle. The 4-track cap lives here in the
                 service: the bridge in MainActivity is a pure
                 pass-through and the page may send more. */
              public void bankBrowse(String tracksJson) {
                  try {
                      List<Track> parsed = parseTracks(tracksJson);
                      List<Track> first = new ArrayList<>();
                      for (int i = 0; i < parsed.size() && first.size() < 4; i++) {
                          Track tr = parsed.get(i);
                          if (tr != null && tr.videoId != null && !tr.videoId.isEmpty()) first.add(tr);
                      }
                      if (first.isEmpty()) return;
                      browseBank = first;
                      bankContextChanged();
                  } catch (Exception ignored) {}
              }

              /* Every queue-context change funnels here: the epoch bump
                 invalidates in-flight targets, the current writer (if any)
                 is cancelled, and the worker re-derives targets from the
                 freshest state. */
              private void bankContextChanged() {
                  bankEpoch.incrementAndGet();
                  CacheWriter w = bankWriter;
                  if (w != null) { try { w.cancel(); } catch (Exception ignored) {} }
                  kickBanking();
              }

              private void kickBanking() {
                  if (mediaCache == null || cacheDsFactory == null) return;
                  if (!bankRunning.compareAndSet(false, true)) {
                      /* A pass is already running (it re-derives targets
                         from the freshest state itself). Remember that a
                         trigger arrived, so the pass re-checks once on its
                         way out instead of losing a trigger that lands in
                         the exit window. */
                      bankKickPending.set(true);
                      return;
                  }
                  try {
                      bankExec.execute(new Runnable() {
                          @Override public void run() {
                              try { bankLoop(); } catch (Exception ignored) {}
                              bankRunning.set(false);
                              if (bankKickPending.getAndSet(false)) kickBanking();
                          }
                      });
                  } catch (Exception e) {
                      bankRunning.set(false);
                  }
              }

              private void bankLoop() {
                  /* One pass. A work item that fails in this pass is not
                     retried within it; the next natural trigger starts a
                     fresh pass with fresh failure sets. Heads and fills
                     keep SEPARATE failure sets, and both sets die with
                     the pass — a head that fails here cannot blacklist
                     its track's fill in a later pass. */
                  java.util.Set<String> failedHeads = new java.util.HashSet<>();
                  java.util.Set<String> failedFills = new java.util.HashSet<>();
                  while (true) {
                      BankTarget t = nextBankWork(failedHeads, failedFills);
                      if (t == null) return;
                      bankOne(t, failedHeads, failedFills);
                  }
              }

              /* The next four indices after the current track, walking
                 the same repeat-aware effective-next step the preload
                 window uses (repeat-one returns -1, so the walk — and
                 play-chain banking — is suppressed exactly like the
                 window; repeat-all wraps and the seen-set stops the
                 walk from revisiting the current track on short
                 queues). */
              private java.util.List<Integer> bankWalk() {
                  java.util.List<Integer> walk = new ArrayList<>();
                  try {
                      if (currentIndex < 0 || currentIndex >= queue.size()) return walk;
                      java.util.Set<Integer> seen = new java.util.HashSet<>();
                      seen.add(currentIndex);
                      int n = currentIndex;
                      for (int i = 0; i < 4; i++) {
                          n = effectiveNextIndex(n);
                          if (n < 0 || seen.contains(n)) break;
                          seen.add(n);
                          walk.add(n);
                      }
                  } catch (Exception ignored) {}
                  return walk;
              }

              /* The freshest work item, or null when there is nothing
                 to do. Order: play-chain HEADS (+1..+4), play-chain
                 FILLS (+1..+4), browse HEADS (tracks 1-4), browse FILLS
                 (tracks 1-2 only). An item is skipped when its track
                 already satisfies it or failed (in either set) earlier
                 this pass — a track whose head failed this pass waits
                 for the next pass for its fill too, since the failure
                 would just repeat on the full download. Browse work
                 only surfaces when the play chain yields nothing — it
                 always wins. */
              private BankTarget nextBankWork(java.util.Set<String> failedHeads,
                                              java.util.Set<String> failedFills) {
                  long ep = bankEpoch.get();
                  try {
                      java.util.List<Integer> walk = bankWalk();
                      for (int k = 0; k < walk.size(); k++) {
                          int idx = walk.get(k);
                          Track tr = queue.get(idx);
                          if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                          if (failedHeads.contains(tr.videoId) || failedFills.contains(tr.videoId)) continue;
                          if (isHeadBanked(tr.videoId)) continue;
                          return new BankTarget(idx, tr.videoId, tr.title, tr.channel, false, ep, true);
                      }
                      for (int k = 0; k < walk.size(); k++) {
                          int idx = walk.get(k);
                          Track tr = queue.get(idx);
                          if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                          if (failedHeads.contains(tr.videoId) || failedFills.contains(tr.videoId)) continue;
                          if (isBanked(tr.videoId)) continue;
                          return new BankTarget(idx, tr.videoId, tr.title, tr.channel, false, ep, false);
                      }
                  } catch (Exception ignored) {}
                  try {
                      List<Track> bb = browseBank;
                      if (bb != null) {
                          for (int i = 0; i < bb.size(); i++) {
                              Track tr = bb.get(i);
                              if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                              if (failedHeads.contains(tr.videoId) || failedFills.contains(tr.videoId)) continue;
                              if (isHeadBanked(tr.videoId)) continue;
                              return new BankTarget(i, tr.videoId, tr.title, tr.channel, true, ep, true);
                          }
                          for (int i = 0; i < bb.size() && i < 2; i++) {
                              Track tr = bb.get(i);
                              if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                              if (failedHeads.contains(tr.videoId) || failedFills.contains(tr.videoId)) continue;
                              if (isBanked(tr.videoId)) continue;
                              return new BankTarget(i, tr.videoId, tr.title, tr.channel, true, ep, false);
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private boolean stillWanted(BankTarget t) {
                  if (t.epoch != bankEpoch.get()) return false;
                  try {
                      if (t.browse) {
                          List<Track> bb = browseBank;
                          return bb != null && t.idx >= 0 && t.idx < bb.size()
                                  && bb.get(t.idx) != null && t.videoId.equals(bb.get(t.idx).videoId);
                      }
                      return t.idx >= 0 && t.idx < queue.size()
                              && queue.get(t.idx) != null && t.videoId.equals(queue.get(t.idx).videoId);
                  } catch (Exception ignored) {}
                  return false;
              }

              private boolean bankYieldNow() {
                  /* v2.2.114: a play resolve in flight yields regardless
                     of the buffer state — the shared resolveExec pool is
                     the contended resource there, not the pipe. */
                  if (playResolveInFlight.get() > 0) return true;
                  /* The player gets the pipe to itself while it is trying
                     to play and holds less than 25 s of buffered-ahead.
                     Paused / idle: the writer may run freely (that is the
                     album-open case). */
                  return bankPlayerWants && bankBufferedAheadMs < 25000;
              }

              private void setBankYield(boolean y) {
                  if (y == bankYielding) return;
                  bankYielding = y;
                  diag(y ? "bank yield" : "bank resume");
              }

              private long bankContentLength(String key) {
                  try {
                      Cache c = mediaCache;
                      if (c == null) return -1;
                      return ContentMetadata.getContentLength(c.getContentMetadata(key));
                  } catch (Exception ignored) {}
                  return -1;
              }

              /* Verified completion only: the content length is known and
                 the cached bytes cover it end to end. */
              private boolean isBanked(String videoId) {
                  try {
                      Cache c = mediaCache;
                      if (c == null || videoId == null || videoId.isEmpty()) return false;
                      String key = cacheKeyFor(videoId);
                      long len = bankContentLength(key);
                      if (len <= 0) return false;
                      return c.getCachedBytes(key, 0, len) >= len;
                  } catch (Exception ignored) {}
                  return false;
              }

              /* v2.2.111: head satisfaction — the cached bytes cover
                 [0, min(BANK_HEAD_BYTES, contentLength)). When the
                 content length is not known yet, the full head size is
                 the requirement. The content length metadata only ever
                 records the true full length (CacheDataSource stores it
                 only at a genuine end-of-input, never at a spec-imposed
                 bound), so a head-only track can never masquerade as
                 fully banked here or in isBanked. */
              private boolean isHeadBanked(String videoId) {
                  try {
                      Cache c = mediaCache;
                      if (c == null || videoId == null || videoId.isEmpty()) return false;
                      String key = cacheKeyFor(videoId);
                      long len = bankContentLength(key);
                      long want = (len > 0) ? Math.min(BANK_HEAD_BYTES, len) : BANK_HEAD_BYTES;
                      return c.getCachedBytes(key, 0, want) >= want;
                  } catch (Exception ignored) {}
                  return false;
              }

              private void bankOne(final BankTarget t, java.util.Set<String> failedHeads,
                                   java.util.Set<String> failedFills) {
                  /* Failures land in the set for this item's kind; the
                     other kind's set is untouched, and both sets die with
                     the pass (see bankLoop). */
                  final java.util.Set<String> failedSet = t.head ? failedHeads : failedFills;
                  if (t.head ? isHeadBanked(t.videoId) : isBanked(t.videoId)) return;
                  /* v2.2.114: yield BEFORE this item's resolve while a
                     play resolve is in flight (see playResolveInFlight) —
                     starting a bank resolve here would put it ahead of
                     the tap's resolve in the shared pool. The wait uses
                     the same yield-state logging as the download loop
                     below (setBankYield), so an episode logs one 'bank
                     yield' / 'bank resume' pair, not a line per poll.
                     Play resolves are deadline-bounded (15/60 s) and the
                     marker clears in a finally, so this wait always ends. */
                  while (playResolveInFlight.get() > 0) {
                      if (!stillWanted(t)) { bankYielding = false; return; }
                      setBankYield(true);
                      try { Thread.sleep(300); } catch (Exception ignored) {}
                  }
                  /* Resolves go through the same choke point as playback:
                     single-flight, video-mime rejection, diag logging. A
                     failed resolve aborts this bank cleanly. */
                  /* v2.2.118: background-deadline parity — bank resolves get the TV
                     60 s deadline on TV (same detection as tap plays), 15 s elsewhere. */
                  ResolveResult rr = resolveShared(t.videoId, t.title, t.artist, (isTvDevice() ? ADVANCE_RESOLVE_DEADLINE_MS : RESOLVE_DEADLINE_MS));
                  if (rr == null || rr.kind != KIND_OK || rr.url == null || rr.url.isEmpty()) {
                      diag("bank failed idx=" + t.idx + " reason=resolve");
                      failedSet.add(t.videoId);
                      return;
                  }
                  final String vid = (rr.resolvedVideoId != null && !rr.resolvedVideoId.isEmpty())
                          ? rr.resolvedVideoId : t.videoId;
                  if (t.head ? isHeadBanked(vid) : isBanked(vid)) return;
                  if (rr.url.contains(".m3u8") || rr.url.contains("/api/manifest/")) {
                      /* A CacheWriter over an HLS manifest would "bank"
                         the playlist file, not the audio — refuse and let
                         playback stream it live as it does today. */
                      diag("bank failed idx=" + t.idx + " reason=hls");
                      failedSet.add(t.videoId);
                      return;
                  }
                  final String key = cacheKeyFor(vid);
                  /* v2.2.111: a head item caches a RANGED DataSpec —
                     position 0, length BANK_HEAD_BYTES. CacheWriter
                     (media3 1.4.1) honors the spec's own range:
                     cache() seeds bytesCached with
                     getCachedBytes(key, position, length) and ends at
                     position + length, and its fill loop skips spans
                     already cached (getCachedLength > 0) and downloads
                     only holes — so a later fill writer on the same key
                     picks up exactly where the head ended, and the
                     player's own write-through spans count too. The key
                     comes from the DataSpec explicitly, as for fills. */
                  final DataSpec spec = t.head
                          ? new DataSpec.Builder().setUri(rr.url).setKey(key)
                                  .setPosition(0).setLength(BANK_HEAD_BYTES).build()
                          : new DataSpec.Builder().setUri(rr.url).setKey(key).build();
                  while (true) {
                      if (!stillWanted(t)) { bankYielding = false; return; }
                      if (bankYieldNow()) {
                          setBankYield(true);
                          try { Thread.sleep(1200); } catch (Exception ignored) {}
                          continue;
                      }
                      setBankYield(false);
                      final CacheWriter[] holder = new CacheWriter[1];
                      CacheWriter.ProgressListener pl = new CacheWriter.ProgressListener() {
                          @Override public void onProgress(long requestLength, long bytesCached, long newBytesCached) {
                              /* Cooperative yield + retarget: cancelling
                                 makes cache() throw InterruptedIOException;
                                 spans already written stay in the cache, so
                                 a later writer for the same key resumes
                                 where this one stopped. */
                              if (holder[0] != null && (!stillWanted(t) || bankYieldNow())) {
                                  try { holder[0].cancel(); } catch (Exception ignored) {}
                              }
                          }
                      };
                      CacheWriter w;
                      try {
                          w = new CacheWriter(cacheDsFactory.createDataSource(), spec, null, pl);
                      } catch (Exception e) {
                          diag("bank failed idx=" + t.idx + " reason=writer");
                          failedSet.add(t.videoId);
                          return;
                      }
                      holder[0] = w;
                      bankWriter = w;
                      try {
                          w.cache();
                      } catch (java.io.InterruptedIOException e) {
                          /* Yielded or retargeted — the loop re-evaluates
                             against the freshest state. */
                          bankWriter = null;
                          continue;
                      } catch (Exception e) {
                          bankWriter = null;
                          diag("bank failed idx=" + t.idx + " reason=io");
                          failedSet.add(t.videoId);
                          return;
                      }
                      bankWriter = null;
                      /* cache() returned: the requested data is cached.
                         When the content length is known, verify the
                         bytes actually cover the claimed range before
                         claiming it — the head range for a head item,
                         the whole track for a fill. When the length is
                         unknown, a CacheWriter run that completed without
                         error over the requested spec counts as satisfied
                         (for a head, that is exactly the ranged download
                         finishing). */
                      if (bankContentLength(key) > 0 && !(t.head ? isHeadBanked(vid) : isBanked(vid))) {
                          diag("bank failed idx=" + t.idx + " reason=short");
                          failedSet.add(t.videoId);
                          return;
                      }
                      diag(t.head ? ("bank head idx=" + t.idx) : ("banked idx=" + t.idx));
                      return;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return binder; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  try { NewPipe.init(new ExtractorDownloader()); } catch (Exception ignored) {}
                  /* v2.2.101: every service (re)start leaves a marker with
                     the device facts and the battery-exemption state, so the
                     Playback log can show whether the OS layer was free to
                     stop this process with the screen off. */
                  diag("service start - " + android.os.Build.MANUFACTURER + " " + android.os.Build.MODEL
                          + " - SDK " + Build.VERSION.SDK_INT + " - batteryExempt=" + batteryExemptStr(this)
                          + " - tv=" + (isTvDevice() ? "yes" : "no"));
                  /* v2.2.105: deeper buffer — his connection delivers
                     ~35 KB/s in bursts, and the stock load control only
                     asks for ~5s of audio before resuming after a stall,
                     so a thin pipe stop-started every few seconds. Now a
                     stall refills ~15s before playback resumes and the
                     player targets 50-90s of buffered audio (about 1 MB
                     at the capped stream rate). Standard knobs only.
                     v2.2.109: the startup cushion joins it — a track banks
                     ~12s before it may start (was ~2.5s) and a stall refills
                     ~30s before playback resumes (was ~15s), so the
                     connection's slow first stretch is spent in the starting
                     wait instead of a few seconds into the song (the
                     album-opener stall the next-track preload can't cover).
                     v2.2.110: the cushion is REVERTED (2500 / 5000) — it
                     backfired on device: stall length = target / delivery
                     rate, so the 12s start target meant a 35s silent load
                     and the 30s refill a 65s stall. Smooth starts now come
                     from the download-and-bank cache below (tracks banked
                     to disk ahead of their boundary), not from deeper
                     starting gates. The 50s/90s targets stay. */
                  initMediaCache();
                  ExoPlayer.Builder playerBuilder = new ExoPlayer.Builder(this)
                          .setLoadControl(new androidx.media3.exoplayer.DefaultLoadControl.Builder()
                                  .setBufferDurationsMs(50000, 90000, 2500, 5000)
                                  .build());
                  /* v2.2.110: play through the disk cache when it is up —
                     a banked track starts from local spans and the player
                     keeps banking whatever it streams for next time. */
                  if (cacheDsFactory != null) {
