                         keycodes (PLAY / PAUSE / PLAY_PAUSE / HEADSETHOOK),
                         shared by their onMediaButtonEvent branches. The
                         v2.2.14 clock (lastBtCommandTime) is GONE: both of its
                         jobs left in this version — the command gate below no
                         longer executes play/pause at all (it passes the
                         request through to the library), and the keycode
                         branches use this gate instead. lastCmdDir is the
                         direction of the last EXECUTED gated press
                         (+1 = play-ward, -1 = pause-ward, 0 = none yet); a
