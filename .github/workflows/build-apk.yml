              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  installCrashCapture();
                  /* v2.2.94: crash dialog removed per user request — no more
                     "The app crashed last time" popup on every launch. */
                  /* showLastCrashIfAny(); */
                  /* v2.2.13: prompt to disable battery optimization so screen-off
                     playback isn't killed after 10-15 minutes. */
                  try {
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent battIntent = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          battIntent.setData(android.net.Uri.parse("package:" + getPackageName()));
                          try { startActivity(battIntent); } catch (Exception ignored) {}
                      }
                  } catch (Exception ignored) {}
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  audioBridgeInstance = new AudioBridge();
                  webView.addJavascriptInterface(audioBridgeInstance, "LynxosPlayer");
                  /* v2.2.92: in-app updater bridge */
                  webView.addJavascriptInterface(new UpdateBridge(), "LynxosUpdater");
                  /* v2.2.30: YouTube Music Python bridge */
                  YTMusicBridge ytmBridgeInstance = new YTMusicBridge();
                  sharedYtmBridge = ytmBridgeInstance;
                  webView.addJavascriptInterface(ytmBridgeInstance, "LynxosYTM");
                  /* v2.2.78: Check if we were launched from OAuth deep link */
                  try {
                      android.net.Uri launchUri = getIntent().getData();
                      if (launchUri != null && "com.lynxosmusic.app".equals(launchUri.getScheme())) {
                          final String launchUrl = launchUri.toString();
                          final String launchEscaped = launchUrl.replace("\\", "\\\\").replace("'", "\\'");
                          webView.postDelayed(new Runnable() {
                              @Override public void run() {
                                  webView.evaluateJavascript(
                                      "(function(){ try { if (window.handleAuthCallback) window.handleAuthCallback('" + launchEscaped + "'); } catch(e){} })()",
                                      null);
                              }
                          }, 2000);
                      }
                  } catch (Exception ignored) {}
                  /* v2.2.106: cold start from a shared YouTube link — stash
                     it now; the page pulls it on init via the bridge. */
                  captureSharedLink(getIntent(), false);
                  /* v2.2.72: Pre-warm Python in background so home screen doesn't freeze
                     waiting for the interpreter to boot on first use.
                     v2.2.114: skipped on TV. Booting the interpreter is
                     the largest single RAM/CPU spike of the first minute,
                     and a Fire TV Stick has 1-2 GB total — stacked on the
                     WebView's first big render it is exactly the kind of
                     peak that gets a renderer (or the app) killed there.
                     Python still starts lazily on first real need
                     (ensurePython runs inside every bridge call and in
                     the service's resolve fallback); the first
                     Python-backed screen on TV may populate a little
                     slower — an acceptable trade against dying in
                     minute one. Non-TV devices keep the warmup. */
                  if (!isTvDevice(this)) {
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  ytmBridgeInstance.warmup();
                              } catch (Exception ignored) {}
                          }
                      }).start();
                  }
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          // Only main-frame navigations: the YouTube iframe's own
                          // subframe loads must stay inside the player.
                          if (request.isForMainFrame()) {
                              String url = request.getUrl().toString();
                              if (url.contains("music.youtube.com") || url.contains("youtube.com/watch") ||
                                  url.contains("supabase.co/auth") || url.contains("accounts.google.com")) {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      view.getContext().startActivity(i);
                                  } catch (Exception ignored) {}
                                  return true;
                              }
                          }
                          return false;
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageAlive = true;
                      }
                      @Override
                      public boolean onRenderProcessGone(WebView view, android.webkit.RenderProcessGoneDetail detail) {
                          /* v2.2.114: without this override, a dead
                             WebView renderer takes the whole app down
                             with it — on a 1-2 GB Fire TV Stick the
                             renderer is the most likely casualty of the
                             first minute's memory peak, and the death is
                             silent (no crash report; the app just
                             closes). Reload the page exactly the way the
                             initial load below does it — same base URL,
                             same asset — and return true to report the
                             event handled, so a renderer kill becomes a
                             brief page reload instead of an app death.
                             (The callback is API 26+; as a WebViewClient
                             override it is simply never invoked on the
                             older runtimes the app still supports.) */
                          try {
                              view.loadDataWithBaseURL(BASE_URL, readAsset("www/index.html"), "text/html", "UTF-8", null);
                          } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  // v1.8.1 fix, folded into v1.9: <input type="file"> in a WebView
                  // does nothing unless the app provides a file chooser. This makes
                  // the Takeout "Choose files" button open the file manager.
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
