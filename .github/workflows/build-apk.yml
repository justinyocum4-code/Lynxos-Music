                      withService(new Runnable() {
                          @Override public void run() { musicService.toggle(); }
                      });
                  }
                  @JavascriptInterface public void pause() {
                      withService(new Runnable() {
                          @Override public void run() { musicService.pausePlayback(); }
                      });
                  }
                  /* v2.2.101: playback diagnostics for the Settings
                     "Playback log" list. MusicService records events into
                     SharedPreferences ("lm_diag", same process); this reads
                     them straight back through its static helper — no
                     service binding needed. Newline-joined "HH:mm:ss event"
                     lines, oldest first. */
                  @JavascriptInterface public String getPlaybackLog() {
                      return MusicService.diagDump(MainActivity.this);
                  }
                  /* v2.2.106: the page pulls a shared YouTube link exactly
                     once — the cold-start init call, the visibility return,
                     and the native warm-start push all funnel here. Returns
                     "" when no link is waiting. */
                  @JavascriptInterface public String getPendingSharedLink() {
                      String s = pendingSharedLink;
                      pendingSharedLink = "";
                      return s == null ? "" : s;
                  }
                  /* v2.2.101: battery-exemption state for the Settings row —
                     the same PowerManager check onCreate's prompt uses. */
                  @JavascriptInterface public boolean isBatteryExempt() {
                      try {
                          android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                          return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                      } catch (Exception e) { return false; }
                  }
                  /* v2.2.101: fire the same exemption request intent the
                     onCreate prompt fires, from the Settings button. Posted
                     to the main thread — bridge methods run on a WebView
                     thread, and startActivity belongs on the UI thread. */
                  @JavascriptInterface public void requestBatteryExemption() {
                      mainHandler.post(new Runnable() {
                          @Override public void run() {
                              try {
                                  Intent battIntent = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
