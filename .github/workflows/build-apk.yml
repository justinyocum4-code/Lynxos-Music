name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        default: '2.0'
      version_code:
        description: 'Version code (whole number, bump every build)'
        required: false
        default: '53'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'First release'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="lynxos-music-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the Lynxos Music app file (lynxos-music-app marker missing)."
            exit 1
          fi

          mkdir -p app/src/main/java/com/lynxosmusic/app app/src/main/assets/www
          cp "$HTML_FILE" app/src/main/assets/www/index.html

          # TV (Leanback) banner so the app shows in the TV launcher row.
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found in repo root; TV banner skipped."
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "LynxosMusicApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.lynxosmusic.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lynxosmusic.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
          }
          dependencies {
              // Native audio engine (v1.9): ExoPlayer plays the music, the
              // NewPipe extractor resolves YouTube audio streams. Both are
              // established open-source libraries.
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- v1.9 native audio: keep music playing with the screen off -->
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="Lynxos Music"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.lynxosmusic.app.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.lynxosmusic.app.MusicService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lynxosmusic/app/MainActivity.java <<'EOF'
          package com.lynxosmusic.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean backArmed = false;
              // The page loads under a real https origin so the YouTube iframe
              // player gets a valid referrer/origin. file:// gives it nothing,
              // and rights-restricted music videos refuse inline playback,
              // showing "Watch on YouTube" instead.
              private static final String BASE_URL = "https://lynxosmusic.app/";
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int NOTIF_PERMISSION_REQUEST = 1002;
              private ValueCallback<Uri[]> filePathCallback;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private MusicService musicService;
              private boolean svcBound = false;
              private boolean pageAlive = false;
              private Runnable pendingSvcAction;

              private final ServiceConnection svcConn = new ServiceConnection() {
                  @Override public void onServiceConnected(ComponentName name, IBinder binder) {
                      musicService = ((MusicService.LocalBinder) binder).getService();
                      try { musicService.setUiListener(svcListener); } catch (Exception ignored) {}
                      svcBound = true;
                      if (pendingSvcAction != null) {
                          final Runnable r = pendingSvcAction;
                          pendingSvcAction = null;
                          mainHandler.post(r);
                      }
                  }
                  @Override public void onServiceDisconnected(ComponentName name) {
                      if (musicService != null) {
                          try { musicService.setUiListener(null); } catch (Exception ignored) {}
                      }
                      musicService = null;
                      svcBound = false;
                  }
              };

              // Forward a JavaScript call to the music service, binding first if needed.
              private void withService(final Runnable r) {
                  if (svcBound && musicService != null) {
                      mainHandler.post(r);
                      return;
                  }
                  pendingSvcAction = r;
                  try {
                      Intent svc = new Intent(this, MusicService.class);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc);
                      else startService(svc);
                      bindService(svc, svcConn, Context.BIND_AUTO_CREATE);
                  } catch (Exception ignored) {}
              }

              // Events coming back from the music service into the web page.
              private final MusicService.UiListener svcListener = new MusicService.UiListener() {
                  private void js(final String code) {
                      mainHandler.post(new Runnable() {
                          @Override public void run() {
                              try { if (webView != null) webView.evaluateJavascript(code, null); }
                              catch (Exception ignored) {}
                          }
                      });
                  }
                  @Override public void onTrackChanged(int index) {
                      js("window.lmNativeTrack&&window.lmNativeTrack(" + index + ")");
                  }
                  @Override public void onProgress(int posSec, int durSec, boolean playing) {
                      js("window.lmNativeProgress&&window.lmNativeProgress(" + posSec + "," + durSec + "," + (playing ? "true" : "false") + ")");
                  }
                  @Override public void onTrackError(String msg) {
                      js("window.lmNativeError&&window.lmNativeError(" + JSONObject.quote(msg == null ? "" : msg) + ")");
                  }
                  @Override public void onTrackEnded() {
                      js("window.lmNativeEnded&&window.lmNativeEnded()");
                  }
                  @Override public boolean onNotifToggle() {
                      if (!pageAlive) return false;
                      js("(function(){try{togglePlayPause()}catch(e){}}())");
                      return true;
                  }
                  @Override public boolean onNotifNext() {
                      if (!pageAlive) return false;
                      js("(function(){try{playNext(false)}catch(e){}}())");
                      return true;
                  }
                  @Override public boolean onNotifPrev() {
                      if (!pageAlive) return false;
                      js("(function(){try{playPrev()}catch(e){}}())");
                      return true;
                  }
              };

              // Called from JavaScript as LynxosPlayer.* — the native audio engine
              // (v1.9). Plays through ExoPlayer in a foreground service so music
              // keeps going with the screen off.
              public class AudioBridge {
                  @JavascriptInterface public void playQueue(final String tracksJson, final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.playQueue(tracksJson, index); }
                      });
                  }
                  @JavascriptInterface public void appendTracks(final String tracksJson) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.appendTracks(tracksJson); }
                      });
                  }
                  @JavascriptInterface public void playAt(final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.playAt(index); }
                      });
                  }
                  @JavascriptInterface public void toggle() {
                      withService(new Runnable() {
                          @Override public void run() { musicService.toggle(); }
                      });
                  }
                  @JavascriptInterface public void pause() {
                      withService(new Runnable() {
                          @Override public void run() { musicService.pausePlayback(); }
                      });
                  }
                  @JavascriptInterface public void seekTo(final int sec) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.seekTo(sec); }
                      });
                  }
                  @JavascriptInterface public void removeAt(final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.removeAt(index); }
                      });
                  }
                  @JavascriptInterface public void truncateAfter(final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.truncateAfter(index); }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  installCrashCapture();
                  showLastCrashIfAny();
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  webView.addJavascriptInterface(new AudioBridge(), "LynxosPlayer");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          // Only main-frame navigations: the YouTube iframe's own
                          // subframe loads must stay inside the player.
                          if (request.isForMainFrame()) {
                              String url = request.getUrl().toString();
                              if (url.contains("music.youtube.com") || url.contains("youtube.com/watch")) {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      view.getContext().startActivity(i);
                                  } catch (Exception ignored) {}
                                  return true;
                              }
                          }
                          return false;
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageAlive = true;
                      }
                  });
                  // v1.8.1 fix, folded into v1.9: <input type="file"> in a WebView
                  // does nothing unless the app provides a file chooser. This makes
                  // the Takeout "Choose files" button open the file manager.
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              try { filePathCallback.onReceiveValue(null); } catch (Exception ignored) {}
                          }
                          filePathCallback = callback;
                          // v1.9.1: always use "*/*" so the file manager never
                          // greys out the CSV files (params.createIntent()
                          // carries the input's accept filter, which many
                          // file managers can't match, leaving nothing
                          // selectable).
                          try {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                              startActivityForResult(Intent.createChooser(intent, "Choose files"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadDataWithBaseURL(BASE_URL, readAsset("www/index.html"), "text/html", "UTF-8", null);
                  }
                  setContentView(webView);
                  // Android 13+ needs this permission for the playback notification.
                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{ Manifest.permission.POST_NOTIFICATIONS }, NOTIF_PERMISSION_REQUEST);
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          try {
                              if (data.getClipData() != null) {
                                  int n = data.getClipData().getItemCount();
                                  results = new Uri[n];
                                  for (int i = 0; i < n; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                              } else if (data.getData() != null) {
                                  results = new Uri[]{ data.getData() };
                              }
                          } catch (Exception ignored) {}
                      }
                      try { filePathCallback.onReceiveValue(results); } catch (Exception ignored) {}
                      filePathCallback = null;
                  }
              }

              // v1.9.1 crash capture: if anything in the app process dies
              // (player service included), save the stack trace. On the next
              // launch it is shown in a dialog so it can be read back.
              private void installCrashCapture() {
                  final Thread.UncaughtExceptionHandler prev = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringBuilder sb = new StringBuilder();
                              sb.append("Thread: ").append(t.getName()).append("\n");
                              sb.append(e.toString()).append("\n");
                              for (StackTraceElement el : e.getStackTrace()) {
                                  sb.append("  at ").append(el.toString()).append("\n");
                                  if (sb.length() > 8000) break;
                              }
                              File f = new File(getFilesDir(), "lm_crash.log");
                              FileWriter fw = new FileWriter(f, false);
                              fw.write(sb.toString());
                              fw.close();
                          } catch (Exception ignored) {}
                          if (prev != null) {
                              try { prev.uncaughtException(t, e); } catch (Exception ignored) {}
                          }
                      }
                  });
              }
              private void showLastCrashIfAny() {
                  try {
                      final File f = new File(getFilesDir(), "lm_crash.log");
                      if (!f.exists() || f.length() == 0 || f.length() > 100000) return;
                      BufferedReader br = new BufferedReader(new InputStreamReader(new java.io.FileInputStream(f), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                      br.close();
                      f.delete();
                      final String crash = sb.toString();
                      if (crash.length() == 0) return;
                      final String show = crash.length() > 3000 ? crash.substring(0, 3000) : crash;
                      mainHandler.postDelayed(new Runnable() {
                          @Override public void run() {
                              try {
                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("The app crashed last time")
                                      .setMessage("What broke:\n" + show)
                                      .setPositiveButton("OK", null)
                                      .show();
                              } catch (Exception ignored) {}
                          }
                      }, 2000);
                  } catch (Exception ignored) {}
              }
              private String readAsset(String path) {
                  try {
                      InputStream is = getAssets().open(path);
                      BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                      br.close();
                      return sb.toString();
                  } catch (Exception e) {
                      return "<html><body>Failed to load app.</body></html>";
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  try { webView.saveState(outState); } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  pageAlive = false;
                  try {
                      if (musicService != null) musicService.setUiListener(null);
                      unbindService(svcConn);
                  } catch (Exception ignored) {}
                  musicService = null;
                  svcBound = false;
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  // The app is a single page: WebView history is empty, so the
                  // back button must consult the JS UI state (full player,
                  // open playlist, current tab) via lmHandleBack().
                  if (backArmed) { backArmed = false; super.onBackPressed(); return; }
                  final Activity self = this;
                  try {
                      webView.evaluateJavascript(
                          "(function(){ try { if (window.lmHandleBack) return window.lmHandleBack(); } catch(e){} return 'exit'; })()",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String value) {
                                  String v = value == null ? "exit" : value.replace("\"", "").trim();
                                  if ("exit".equals(v)) {
                                      backArmed = true;
                                      self.onBackPressed();
                                  }
                                  // else: JS consumed the back press
                              }
                          });
                  } catch (Exception e) {
                      super.onBackPressed();
                  }
              }

              // TV remote media keys: play/pause toggles, next skips forward,
              // previous restarts the song (or jumps back when pressed twice).
              // Routed into the page's lmRemote* hooks so one code path drives
              // both the on-screen buttons and the remote.
              @Override
              public boolean dispatchKeyEvent(android.view.KeyEvent event) {
                  if (event.getAction() == android.view.KeyEvent.ACTION_DOWN) {
                      String js = null;
                      switch (event.getKeyCode()) {
                          case android.view.KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          case android.view.KeyEvent.KEYCODE_MEDIA_PLAY:
                          case android.view.KeyEvent.KEYCODE_MEDIA_PAUSE:
                              js = "(function(){ try { if (window.lmRemotePlayPause) return window.lmRemotePlayPause(); } catch(e){} return 'exit'; })()";
                              break;
                          case android.view.KeyEvent.KEYCODE_MEDIA_NEXT:
                          case android.view.KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                              js = "(function(){ try { if (window.lmRemoteNext) return window.lmRemoteNext(); } catch(e){} return 'exit'; })()";
                              break;
                          case android.view.KeyEvent.KEYCODE_MEDIA_PREVIOUS:
                          case android.view.KeyEvent.KEYCODE_MEDIA_REWIND:
                              js = "(function(){ try { if (window.lmRemotePrev) return window.lmRemotePrev(); } catch(e){} return 'exit'; })()";
                              break;
                      }
                      if (js != null) {
                          try { webView.evaluateJavascript(js, null); } catch (Exception ignored) {}
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }
          }

          EOF

          cat > app/src/main/java/com/lynxosmusic/app/MusicService.java <<'EOF'
          package com.lynxosmusic.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Binder;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ExtractionException;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.DeliveryMethod;
          import org.schabi.newpipe.extractor.stream.StreamExtractor;

          /**
           * v1.9 native audio engine. Plays music through ExoPlayer in a foreground
           * service, so playback keeps going with the screen off. Audio stream URLs
           * are resolved from YouTube video IDs with the NewPipe extractor
           * (the same approach NewPipe-style apps use).
           */
          public class MusicService extends Service {

              public interface UiListener {
                  void onTrackChanged(int index);
                  void onProgress(int posSec, int durSec, boolean playing);
                  void onTrackError(String msg);
                  void onTrackEnded();
                  // Notification buttons. Return true when the web page handled it
                  // (its own shuffle/repeat/radio policy); false for simple fallback.
                  boolean onNotifToggle();
                  boolean onNotifNext();
                  boolean onNotifPrev();
              }

              public static class Track {
                  public String videoId = "";
                  public String title = "";
                  public String channel = "";
                  public String thumb = "";
              }

              public class LocalBinder extends Binder {
                  public MusicService getService() { return MusicService.this; }
              }

              public static final String ACT_TOGGLE = "com.lynxosmusic.app.TOGGLE";
              public static final String ACT_NEXT = "com.lynxosmusic.app.NEXT";
              public static final String ACT_PREV = "com.lynxosmusic.app.PREV";
              private static final String CH_ID = "lynxos_music_playback";
              private static final int NOTIF_ID = 7;

              private final IBinder binder = new LocalBinder();
              private ExoPlayer player;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private final List<Track> queue = new ArrayList<>();
              private int currentIndex = -1;
              private UiListener ui;

              private final Runnable progressTick = new Runnable() {
                  @Override public void run() {
                      pushProgress();
                      main.postDelayed(this, 1000);
                  }
              };

              @Override
              public IBinder onBind(Intent intent) { return binder; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  try { NewPipe.init(new ExtractorDownloader()); } catch (Exception ignored) {}
                  player = new ExoPlayer.Builder(this).build();
                  try {
                      player.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.CONTENT_TYPE_MUSIC)
                              .build(), true);
                  } catch (Exception ignored) {}
                  try { player.setWakeMode(C.WAKE_MODE_NETWORK); } catch (Exception ignored) {}
                  player.addListener(new Player.Listener() {
                      @Override public void onPlaybackStateChanged(int state) {
                          if (state == Player.STATE_ENDED) {
                              UiListener l = ui;
                              if (l != null) { try { l.onTrackEnded(); } catch (Exception ignored) {} }
                              else { playAtInternal(currentIndex + 1); }
                          } else if (state == Player.STATE_READY) {
                              updateNotification();
                          }
                      }
                      @Override public void onIsPlayingChanged(boolean isPlaying) {
                          updateNotification();
                          pushProgress();
                      }
                      @Override public void onPlayerError(PlaybackException error) {
                          String msg = "";
                          try { msg = String.valueOf(error.getMessage()); } catch (Exception ignored) {}
                          UiListener l = ui;
                          if (l != null) { try { l.onTrackError(msg); } catch (Exception ignored) {} }
                          else { playAtInternal(currentIndex + 1); }
                      }
                  });
                  createChannel();
                  main.post(progressTick);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null) {
                      String a = intent.getAction();
                      UiListener l = ui;
                      if (ACT_TOGGLE.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifToggle(); } catch (Exception ignored) {} }
                          if (!consumed) toggleInternal();
                      } else if (ACT_NEXT.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifNext(); } catch (Exception ignored) {} }
                          if (!consumed) playAtInternal(currentIndex + 1);
                      } else if (ACT_PREV.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifPrev(); } catch (Exception ignored) {} }
                          if (!consumed) playAtInternal(currentIndex - 1);
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try { main.removeCallbacks(progressTick); } catch (Exception ignored) {}
                  try { bg.shutdownNow(); } catch (Exception ignored) {}
                  try { if (player != null) player.release(); } catch (Exception ignored) {}
                  player = null;
                  super.onDestroy();
              }

              public void setUiListener(UiListener l) { ui = l; }

              // ---- public API: call on the main thread ----

              public void playQueue(String tracksJson, int index) {
                  List<Track> t = parseTracks(tracksJson);
                  queue.clear();
                  queue.addAll(t);
                  playAtInternal(index);
              }

              public void appendTracks(String tracksJson) {
                  queue.addAll(parseTracks(tracksJson));
              }

              public void playAt(int index) { playAtInternal(index); }

              public void toggle() { toggleInternal(); }

              public void pausePlayback() {
                  try { if (player != null && player.isPlaying()) player.pause(); } catch (Exception ignored) {}
                  pushProgress();
                  updateNotification();
              }

              public void seekTo(int sec) {
                  try { if (player != null) player.seekTo(Math.max(0, sec) * 1000L); } catch (Exception ignored) {}
                  pushProgress();
              }

              public void removeAt(int index) {
                  if (index < 0 || index >= queue.size() || index == currentIndex) return;
                  queue.remove(index);
                  if (index < currentIndex) currentIndex--;
              }

              public void truncateAfter(int index) {
                  while (queue.size() > index + 1) queue.remove(queue.size() - 1);
              }

              // ---- internals ----

              private void toggleInternal() {
                  try {
                      if (player == null) return;
                      if (player.isPlaying()) player.pause();
                      else if (currentIndex >= 0 && currentIndex < queue.size()) player.play();
                  } catch (Exception ignored) {}
                  pushProgress();
                  updateNotification();
              }

              private void playAtInternal(int i) {
                  if (player == null || i < 0 || i >= queue.size()) return;
                  currentIndex = i;
                  final Track t = queue.get(i);
                  final int wantIndex = i;
                  goForeground(t, true);
                  bg.execute(new Runnable() {
                      @Override public void run() {
                          String url = null;
                          String err = "";
                          try { url = resolveAudioUrl(t.videoId); }
                          catch (Throwable th) { try { err = String.valueOf(th.toString()); } catch (Exception ignored) {} }
                          final String fUrl = url;
                          final String fErr = err;
                          main.post(new Runnable() {
                              @Override public void run() {
                                  if (player == null || wantIndex != currentIndex) return;
                                  if (fUrl == null || fUrl.isEmpty()) {
                                      UiListener l = ui;
                                      if (l != null) { try { l.onTrackError(fErr); } catch (Exception ignored) {} }
                                      else { playAtInternal(currentIndex + 1); }
                                      return;
                                  }
                                  try {
                                      player.setMediaItem(MediaItem.fromUri(fUrl));
                                      player.prepare();
                                      player.play();
                                  } catch (Throwable th) {
                                      UiListener l = ui;
                                      if (l != null) { try { l.onTrackError("Playback failed."); } catch (Exception ignored) {} }
                                      return;
                                  }
                                  updateNotification();
                                  UiListener l = ui;
                                  if (l != null) { try { l.onTrackChanged(wantIndex); } catch (Exception ignored) {} }
                              }
                          });
                      }
                  });
              }

              private String resolveAudioUrl(String videoId) throws Exception {
                  StreamExtractor ex = ServiceList.YouTube.getStreamExtractor("https://www.youtube.com/watch?v=" + videoId);
                  ex.fetchPage();
                  List<AudioStream> streams = ex.getAudioStreams();
                  AudioStream best = null;
                  for (AudioStream s : streams) {
                      if (s.getDeliveryMethod() != DeliveryMethod.PROGRESSIVE_HTTP) continue;
                      String u = "";
                      try { u = s.getUrl(); } catch (Exception ignored) {}
                      if (u == null || u.isEmpty()) continue;
                      if (best == null || s.getAverageBitrate() > best.getAverageBitrate()) best = s;
                  }
                  if (best == null) {
                      for (AudioStream s : streams) {
                          String u = "";
                          try { u = s.getUrl(); } catch (Exception ignored) {}
                          if (u != null && !u.isEmpty()) { best = s; break; }
                      }
                  }
                  if (best == null) throw new ExtractionException("No playable audio stream found");
                  return best.getUrl();
              }

              private List<Track> parseTracks(String json) {
                  List<Track> out = new ArrayList<>();
                  try {
                      JSONArray arr = new JSONArray(json);
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          Track t = new Track();
                          t.videoId = o.optString("videoId", "");
                          t.title = o.optString("title", t.videoId);
                          t.channel = o.optString("channel", "");
                          t.thumb = o.optString("thumb", "");
                          if (t.videoId != null && !t.videoId.isEmpty()) out.add(t);
                      }
                  } catch (Exception ignored) {}
                  return out;
              }

              private void pushProgress() {
                  UiListener l = ui;
                  if (l == null || player == null) return;
                  long pos = 0, dur = 0;
                  boolean playing = false;
                  try {
                      pos = Math.max(0, player.getCurrentPosition());
                      dur = player.getDuration();
                      playing = player.isPlaying();
                  } catch (Exception ignored) {}
                  if (dur == C.TIME_UNSET || dur < 0) dur = 0;
                  try { l.onProgress((int) (pos / 1000), (int) (dur / 1000), playing); } catch (Exception ignored) {}
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          NotificationChannel ch = new NotificationChannel(CH_ID, "Music playback", NotificationManager.IMPORTANCE_LOW);
                          ch.setDescription("Lynxos Music playback controls");
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.createNotificationChannel(ch);
                      } catch (Exception ignored) {}
                  }
              }

              private PendingIntent svcAction(String action) {
                  Intent i = new Intent(this, MusicService.class).setAction(action);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getService(this, action.hashCode(), i, flags);
              }

              private Notification buildNotification(Track t, boolean loading) {
                  boolean playing = false;
                  try { playing = player != null && player.isPlaying(); } catch (Exception ignored) {}
                  String title = (t != null && t.title != null && !t.title.isEmpty()) ? t.title : "Lynxos Music";
                  String artist = (t != null && t.channel != null) ? t.channel : "";
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) b = new Notification.Builder(this, CH_ID);
                  else b = new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                   .setContentTitle(loading ? "Loading…" : title)
                   .setContentText(artist)
                   .setOngoing(true)
                   .setOnlyAlertOnce(true);
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_previous, "Previous", svcAction(ACT_PREV)).build());
                  b.addAction(new Notification.Action.Builder(
                      playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                      playing ? "Pause" : "Play", svcAction(ACT_TOGGLE)).build());
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_next, "Next", svcAction(ACT_NEXT)).build());
                  try {
                      Intent open = new Intent(this, MainActivity.class);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                      b.setContentIntent(PendingIntent.getActivity(this, 0, open, flags));
                  } catch (Exception ignored) {}
                  return b.build();
              }

              private void goForeground(Track t, boolean loading) {
                  try {
                      Notification n = buildNotification(t, loading);
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIF_ID, n);
                      }
                  } catch (Exception ignored) {}
              }

              private void updateNotification() {
                  Track t = (currentIndex >= 0 && currentIndex < queue.size()) ? queue.get(currentIndex) : null;
                  if (t == null) return;
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(NOTIF_ID, buildNotification(t, false));
                  } catch (Exception ignored) {}
              }

              /** Minimal HTTP downloader for the NewPipe extractor. */
              static class ExtractorDownloader extends Downloader {
                  @Override
                  public Response execute(Request request) throws IOException {
                      HttpURLConnection conn = (HttpURLConnection) new URL(request.url()).openConnection();
                      try {
                          conn.setRequestMethod(request.httpMethod());
                      } catch (Exception e) {
                          throw new IOException("Bad HTTP method");
                      }
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(15000);
                      conn.setInstanceFollowRedirects(true);
                      Map<String, List<String>> headers = request.headers();
                      if (headers != null) {
                          for (Map.Entry<String, List<String>> e : headers.entrySet()) {
                              if (e.getKey() == null) continue;
                              for (String v : e.getValue()) {
                                  try { conn.addRequestProperty(e.getKey(), v); } catch (Exception ignored) {}
                              }
                          }
                      }
                      byte[] body = request.dataToSend();
                      if (body != null && body.length > 0) {
                          conn.setDoOutput(true);
                          conn.getOutputStream().write(body);
                      }
                      int code = conn.getResponseCode();
                      InputStream is = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      StringBuilder sb = new StringBuilder();
                      if (is != null) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line).append('\n');
                          br.close();
                      }
                      String latestUrl;
                      try { latestUrl = conn.getURL().toString(); } catch (Exception e) { latestUrl = request.url(); }
                      Map<String, List<String>> respHeaders = conn.getHeaderFields();
                      conn.disconnect();
                      return new Response(code, String.valueOf(code), respHeaders, sb.toString(), latestUrl);
                  }
              }
          }

          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lynxos-music-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}+${{ inputs.version_code }}
          name: Lynxos Music v${{ inputs.version_name }}+${{ inputs.version_code }}
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/release/app-release.apk
