              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  installCrashCapture();
                  /* v2.2.94: crash dialog removed per user request — no more
                     "The app crashed last time" popup on every launch. */
                  /* showLastCrashIfAny(); */
                  /* v2.2.13: prompt to disable battery optimization so screen-off
                     playback isn't killed after 10-15 minutes. */
                  try {
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent battIntent = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          battIntent.setData(android.net.Uri.parse("package:" + getPackageName()));
                          try { startActivity(battIntent); } catch (Exception ignored) {}
                      }
                  } catch (Exception ignored) {}
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  webView.addJavascriptInterface(new AudioBridge(), "LynxosPlayer");
                  /* v2.2.92: in-app updater bridge */
                  webView.addJavascriptInterface(new UpdateBridge(), "LynxosUpdater");
                  /* v2.2.30: YouTube Music Python bridge */
                  YTMusicBridge ytmBridgeInstance = new YTMusicBridge();
                  sharedYtmBridge = ytmBridgeInstance;
                  webView.addJavascriptInterface(ytmBridgeInstance, "LynxosYTM");
                  /* v2.2.78: Check if we were launched from OAuth deep link */
                  try {
                      android.net.Uri launchUri = getIntent().getData();
                      if (launchUri != null && "com.lynxosmusic.app".equals(launchUri.getScheme())) {
                          final String launchUrl = launchUri.toString();
                          final String launchEscaped = launchUrl.replace("\\", "\\\\").replace("'", "\\'");
                          webView.postDelayed(new Runnable() {
                              @Override public void run() {
                                  webView.evaluateJavascript(
                                      "(function(){ try { if (window.handleAuthCallback) window.handleAuthCallback('" + launchEscaped + "'); } catch(e){} })()",
                                      null);
                              }
                          }, 2000);
                      }
                  } catch (Exception ignored) {}
                  /* v2.2.106: cold start from a shared YouTube link — stash
                     it now; the page pulls it on init via the bridge. */
                  captureSharedLink(getIntent(), false);
                  /* v2.2.72: Pre-warm Python in background so home screen doesn't freeze
                     waiting for the interpreter to boot on first use. */
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try {
                              ytmBridgeInstance.warmup();
                          } catch (Exception ignored) {}
                      }
                  }).start();
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          // Only main-frame navigations: the YouTube iframe's own
                          // subframe loads must stay inside the player.
                          if (request.isForMainFrame()) {
                              String url = request.getUrl().toString();
                              if (url.contains("music.youtube.com") || url.contains("youtube.com/watch") ||
                                  url.contains("supabase.co/auth") || url.contains("accounts.google.com")) {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      view.getContext().startActivity(i);
                                  } catch (Exception ignored) {}
                                  return true;
                              }
                          }
                          return false;
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageAlive = true;
                      }
                  });
                  // v1.8.1 fix, folded into v1.9: <input type="file"> in a WebView
                  // does nothing unless the app provides a file chooser. This makes
                  // the Takeout "Choose files" button open the file manager.
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              try { filePathCallback.onReceiveValue(null); } catch (Exception ignored) {}
                          }
                          filePathCallback = callback;
                          // v1.9.1: always use "*/*" so the file manager never
                          // greys out the CSV files (params.createIntent()
                          // carries the input's accept filter, which many
                          // file managers can't match, leaving nothing
                          // selectable).
                          try {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                              startActivityForResult(Intent.createChooser(intent, "Choose files"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadDataWithBaseURL(BASE_URL, readAsset("www/index.html"), "text/html", "UTF-8", null);
                  }
                  setContentView(webView);
                  // Android 13+ needs this permission for the playback notification.
                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{ Manifest.permission.POST_NOTIFICATIONS }, NOTIF_PERMISSION_REQUEST);
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          try {
                              if (data.getClipData() != null) {
                                  int n = data.getClipData().getItemCount();
                                  results = new Uri[n];
                                  for (int i = 0; i < n; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                              } else if (data.getData() != null) {
                                  results = new Uri[]{ data.getData() };
                              }
                          } catch (Exception ignored) {}
                      }
                      try { filePathCallback.onReceiveValue(results); } catch (Exception ignored) {}
                      filePathCallback = null;
                  }
              }

              // v1.9.1 crash capture: if anything in the app process dies
              // (player service included), save the stack trace. On the next
              // launch it is shown in a dialog so it can be read back.
              private void installCrashCapture() {
                  final Thread.UncaughtExceptionHandler prev = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringBuilder sb = new StringBuilder();
                              sb.append("Thread: ").append(t.getName()).append("\n");
                              sb.append(e.toString()).append("\n");
                              for (StackTraceElement el : e.getStackTrace()) {
                                  sb.append("  at ").append(el.toString()).append("\n");
                                  if (sb.length() > 8000) break;
                              }
                              File f = new File(getFilesDir(), "lm_crash.log");
                              FileWriter fw = new FileWriter(f, false);
                              fw.write(sb.toString());
                              fw.close();
                          } catch (Exception ignored) {}
                          if (prev != null) {
                              try { prev.uncaughtException(t, e); } catch (Exception ignored) {}
                          }
                      }
                  });
              }
              private void showLastCrashIfAny() {
                  try {
                      final File f = new File(getFilesDir(), "lm_crash.log");
                      if (!f.exists() || f.length() == 0 || f.length() > 100000) return;
                      BufferedReader br = new BufferedReader(new InputStreamReader(new java.io.FileInputStream(f), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                      br.close();
                      f.delete();
                      final String crash = sb.toString();
                      if (crash.length() == 0) return;
                      final String show = crash.length() > 3000 ? crash.substring(0, 3000) : crash;
                      mainHandler.postDelayed(new Runnable() {
                          @Override public void run() {
                              try {
                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("The app crashed last time")
                                      .setMessage("What broke:\n" + show)
                                      .setPositiveButton("OK", null)
                                      .show();
                              } catch (Exception ignored) {}
                          }
                      }, 2000);
                  } catch (Exception ignored) {}
              }
              private String readAsset(String path) {
                  try {
                      InputStream is = getAssets().open(path);
                      BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                      br.close();
                      return sb.toString();
                  } catch (Exception e) {
                      return "<html><body>Failed to load app.</body></html>";
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  /* v2.2.94: FIX for TransactionTooLargeException. The old
                     code called webView.saveState(outState), which stuffed
                     ~539KB into the parcel and crashed the app with
                     "data parcel size 539152 bytes" whenever the activity
                     stopped (e.g., opening the file picker). This app
                     reinitializes from index.html on every launch and never
                     uses saved state, so we clear the bundle instead. */
                  super.onSaveInstanceState(outState);
                  try { outState.clear(); } catch (Exception ignored) {}
              }

