              private String getCachedUrl(String videoId) {
                  try {
                      synchronized (urlCache) {
                          String url = urlCache.get(videoId);
                          Long time = urlCacheTime.get(videoId);
                          if (url != null && time != null) {
                              if (System.currentTimeMillis() - time < URL_CACHE_TTL_MS) {
                                  return url;
                              } else {
                                  /* Expired - remove */
                                  urlCache.remove(videoId);
                                  urlCacheTime.remove(videoId);
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }
              private void putCachedUrl(String videoId, String url) {
                  try {
                      synchronized (urlCache) {
                          urlCache.put(videoId, url);
                          urlCacheTime.put(videoId, System.currentTimeMillis());
                      }
                  } catch (Exception ignored) {}
              }
              private void clearCachedUrl(String videoId) {
                  try {
                      synchronized (urlCache) {
                          urlCache.remove(videoId);
                          urlCacheTime.remove(videoId);
                      }
                  } catch (Exception ignored) {}
              }
