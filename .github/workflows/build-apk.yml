                 gone (private / removed / unavailable) rather than a blip?
                 Class-name checks cover NewPipe's ContentNotAvailable family;
                 message matching is the fallback. */
              private boolean isUnavailableError(Throwable th) {
                  try {
                      String name = th.getClass().getName();
                      if (name.contains("ContentNotAvailable") || name.contains("PrivateContent") ||
                          name.contains("SignInRequired") || name.contains("RemovedContent") ||
                          name.contains("DeletedContent")) return true;
                      String m = String.valueOf(th.getMessage()).toLowerCase();
                      return m.contains("video unavailable") || m.contains("private video") ||
                             m.contains("no longer available") || m.contains("video removed") ||
                             m.contains("this video is private") || m.contains("has been removed");
                  } catch (Exception ignored) {}
                  return false;
              }
