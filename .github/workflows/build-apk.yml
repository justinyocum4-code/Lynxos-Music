              public class AudioBridge {
                  @JavascriptInterface public void playQueue(final String tracksJson, final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.playQueue(tracksJson, index); }
                      });
                  }
                  @JavascriptInterface public void appendTracks(final String tracksJson) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.appendTracks(tracksJson); }
                      });
                  }
                  /* v2.2.110: album-open browse banking — the page hands
                     the service an opened album's first tracks so the
                     banking worker can download them to disk before any
                     tap. Browse context only; never starts playback. */
                  @JavascriptInterface public void bankBrowse(final String tracksJson) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.bankBrowse(tracksJson); }
                      });
                  }
                  @JavascriptInterface public void playAt(final int index) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.playAt(index); }
                      });
                  }
                  /* v2.1.1: album tracks are resolved on demand in JS, so the
                     service's copy of the queue can hold a blank videoId.
                     Sync the resolved id before playing. */
                  @JavascriptInterface public void playTrackAt(final int index, final String videoId) {
                      withService(new Runnable() {
                          @Override public void run() { musicService.playTrackAt(index, videoId); }
                      });
                  }
