                                                      main.post(new Runnable() {
                                                          @Override public void run() {
                                                              UiListener l = ui;
                                                              boolean consumed = false;
                                                              if (l != null) { try { consumed = l.onNotifNext(); } catch (Exception ignored) {} }
                                                              if (!consumed) playAtInternal(currentIndex + 1);
                                                          }
