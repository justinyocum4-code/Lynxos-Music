              /* v2.2.101: diagnostics write — see the DIAG_PREFS field
                 comment. Static storage helpers so MainActivity can read
                 the same prefs file for the Settings bridge without needing
                 the service bound. The whole body is wrapped: a logging
                 failure must never reach playback code. */
              private void diag(String event) {
                  try { diagLog(this, event); } catch (Throwable ignored) {}
              }
              static void diagLog(Context ctx, String event) {
                  try {
                      if (ctx == null || event == null) return;
                      synchronized (DIAG_LOCK) {
                          android.content.SharedPreferences sp =
                                  ctx.getSharedPreferences(DIAG_PREFS, Context.MODE_PRIVATE);
                          String old = sp.getString("entries", "");
                          String ts = new java.text.SimpleDateFormat("HH:mm:ss", java.util.Locale.US)
                                  .format(new java.util.Date());
                          String line = ts + " " + event;
                          String all = (old == null || old.isEmpty()) ? line : old + "\n" + line;
                          String[] parts = all.split("\n");
                          if (parts.length > DIAG_MAX) {
                              StringBuilder sb = new StringBuilder();
                              for (int k = parts.length - DIAG_MAX; k < parts.length; k++) {
                                  if (sb.length() > 0) sb.append('\n');
                                  sb.append(parts[k]);
                              }
                              all = sb.toString();
                          }
                          sp.edit().putString("entries", all).apply();
                      }
                  } catch (Throwable ignored) {}
              }
              public static String diagDump(Context ctx) {
                  try {
                      if (ctx == null) return "";
                      synchronized (DIAG_LOCK) {
                          android.content.SharedPreferences sp =
                                  ctx.getSharedPreferences(DIAG_PREFS, Context.MODE_PRIVATE);
                          String s = sp.getString("entries", "");
                          return (s == null) ? "" : s;
                      }
                  } catch (Throwable ignored) {}
                  return "";
              }
              private static String batteryExemptStr(Context ctx) {
                  try {
                      android.os.PowerManager pm = (android.os.PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                      if (pm == null) return "unknown";
                      return pm.isIgnoringBatteryOptimizations(ctx.getPackageName()) ? "yes" : "no";
                  } catch (Throwable ignored) {}
                  return "unknown";
              }
              private static String shorten(String s) {
                  try {
                      if (s == null) return "";
                      s = s.replace('\n', ' ').replace('\r', ' ');
                      return (s.length() > 60) ? s.substring(0, 60) : s;
                  } catch (Exception ignored) { return ""; }
              }
              /* v2.2.98: does this extractor error mean the upload itself is
                 gone (private / removed / unavailable) rather than a blip?
                 Class-name checks cover NewPipe's ContentNotAvailable family;
                 message matching is the fallback. */
              private boolean isUnavailableError(Throwable th) {
                  try {
                      String name = th.getClass().getName();
                      if (name.contains("ContentNotAvailable") || name.contains("PrivateContent") ||
                          name.contains("SignInRequired") || name.contains("RemovedContent") ||
                          name.contains("DeletedContent")) return true;
                      String m = String.valueOf(th.getMessage()).toLowerCase();
                      return m.contains("video unavailable") || m.contains("private video") ||
                             m.contains("no longer available") || m.contains("video removed") ||
                             m.contains("this video is private") || m.contains("has been removed");
                  } catch (Exception ignored) {}
                  return false;
              }
              /* v2.2.98: the URL the player is currently holding (the one
                 that just failed), so a "fresh" resolve that returns the
                 identical URL isn't retried pointlessly. */
              private String currentMediaUrl() {
                  try {
                      if (player != null && player.getCurrentMediaItem() != null &&
                          player.getCurrentMediaItem().localConfiguration != null &&
                          player.getCurrentMediaItem().localConfiguration.uri != null) {
                          return String.valueOf(player.getCurrentMediaItem().localConfiguration.uri);
                      }
                  } catch (Exception ignored) {}
                  return "";
              }
              /* v2.2.98: single-flight resolve with an aggregate deadline.
                 The first caller for a videoId starts ONE resolve on
                 resolveExec; everyone else (play path included) waits on the
                 same Future, capped at RESOLVE_DEADLINE_MS. The resolve task
                 itself writes the URL cache, so a waiter that times out
                 doesn't lose the result — the orphan still populates the
                 cache when it lands. Timeouts classify TRANSIENT.
                 v2.2.100: two semantic fixes. (1) The in-flight entry is now
                 removed ONLY by the owning resolve task itself when it
                 completes. A waiter whose deadline expired used to evict it
                 in its finally block while the resolve was still running,
                 so the next caller started a DUPLICATE resolve (serialized
                 on the Python GIL) and the orphan's late success was never
                 re-consumed. Now a later caller joins the existing future.
                 (2) The deadline is a parameter: the tap path keeps 15s;
                 the native ended-advance (and its floor) passes 60s and, if
                 even that expires, re-checks the URL cache once before
                 declaring failure — the resolve may have just landed. */
              private ResolveResult resolveShared(final String videoId, final String title, final String artist) {
                  return resolveShared(videoId, title, artist, RESOLVE_DEADLINE_MS);
              }
              private ResolveResult resolveShared(final String videoId, final String title, final String artist, final long deadlineMs) {
                  ResolveResult out = new ResolveResult();
                  if (videoId == null || videoId.isEmpty()) { out.message = "No video id"; return out; }
                  String cached = getCachedUrl(videoId);
                  if (cached != null && !cached.isEmpty()) {
                      /* v2.2.106: the video-stream gate covers cache hits
                         too — a URL cached by an older build must never
                         reach the player if it declares video. A rejected
                         hit is evicted and the resolve falls through to a
                         fresh extraction. */
                      if (isVideoStreamUrl(cached)) {
                          diag("resolve rejected video stream " + describeStreamUrl(cached));
                          clearCachedUrl(videoId);
                      } else {
                          diag("resolve cache " + describeStreamUrl(cached));
                          out.url = cached; out.resolvedVideoId = videoId; out.kind = KIND_OK;
                          return out;
                      }
                  }
                  if (isDeadId(videoId)) {
                      out.kind = KIND_DEAD; out.message = "Upload known to be gone";
                      return out;
                  }
                  final java.util.concurrent.atomic.AtomicReference<java.util.concurrent.FutureTask<ResolveResult>> selfRef =
                          new java.util.concurrent.atomic.AtomicReference<java.util.concurrent.FutureTask<ResolveResult>>();
                  java.util.concurrent.Callable<ResolveResult> task = new java.util.concurrent.Callable<ResolveResult>() {
                      @Override public ResolveResult call() {
                          try {
                              ResolveResult r = resolveAudioUrl(videoId, title, artist);
                              /* v2.2.106: VIDEO-STREAM GATE — the choke point.
                                 resolveShared is the only road a stream URL
                                 can take to the player (playAtInternal, the
                                 native floor, and prefetch all consume its
                                 result; nothing else sets a media item). A
                                 URL that declares a video mime — the muxed
                                 file a poisoned fallback can hand back, which
                                 fits the Z-Ro album's starvation arithmetic
                                 exactly — is converted here into an ordinary
                                 TRANSIENT failure BEFORE the cache write
                                 below, so it is never cached, never played,
                                 and the caller's usual next-option machinery
                                 (page candidates, floor advance) proceeds
                                 exactly as for any failed resolve. */
                              if (r != null && r.kind == KIND_OK && isVideoStreamUrl(r.url)) {
                                  diag("resolve rejected video stream " + describeStreamUrl(r.url));
                                  r.kind = KIND_TRANSIENT;
                                  r.message = "Rejected a video stream";
                                  r.url = null;
                              }
                              try {
                                  if (r != null && r.kind == KIND_OK && r.url != null && !r.url.isEmpty()) {
                                      /* Cache under the WINNING id — an alternative
                                         upload's URL must not be filed under the
                                         dead id that was originally asked for. */
                                      String wid = (r.resolvedVideoId != null && !r.resolvedVideoId.isEmpty()) ? r.resolvedVideoId : videoId;
                                      putCachedUrl(wid, r.url);
                                  }
                              } catch (Exception ignored) {}
                              return r;
                          } finally {
                              /* v2.2.100: owner-only removal — the task
                                 itself unregisters when it completes, never
                                 a timed-out waiter (see method comment). */
                              try { inFlight.remove(videoId, selfRef.get()); } catch (Exception ignored) {}
                          }
                      }
                  };
                  java.util.concurrent.FutureTask<ResolveResult> ft =
                          new java.util.concurrent.FutureTask<ResolveResult>(task);
                  selfRef.set(ft);
                  java.util.concurrent.Future<ResolveResult> existing = inFlight.putIfAbsent(videoId, ft);
                  boolean owner = (existing == null);
                  java.util.concurrent.Future<ResolveResult> f = owner ? ft : existing;
                  if (owner) {
                      try { resolveExec.execute(ft); }
                      catch (Exception e) {
                          /* The task will never run, so it can never remove
                             its own entry — the submitter cleans up instead. */
                          inFlight.remove(videoId, ft);
                          out.message = String.valueOf(e);
                          return out;
                      }
                  }
                  try {
                      ResolveResult r = f.get(deadlineMs, java.util.concurrent.TimeUnit.MILLISECONDS);
                      if (r != null) out = r;
                  } catch (java.util.concurrent.TimeoutException te) {
                      /* v2.2.101: record the deadline expiry (which deadline,
                         which videoId) — the diagnostics log's evidence for
                         whether screen-off advances starve right here. */
                      diag("resolve timeout " + deadlineMs + "ms id=" + videoId);
                      /* Not cancelled: the task is still running and will
                         fill the cache when it lands. The long-deadline
                         (advance) caller gets one cache re-check before
                         giving up — the resolve may have JUST landed. */
                      String late = null;
                      if (deadlineMs > RESOLVE_DEADLINE_MS) {
                          try { late = getCachedUrl(videoId); } catch (Exception ignored) {}
                      }
                      /* v2.2.106: the late cache re-check passes the same
                         gate as every other exit (defense in depth — the
                         owning task already gates before it caches). */
                      if (late != null && !late.isEmpty() && isVideoStreamUrl(late)) {
                          diag("resolve rejected video stream " + describeStreamUrl(late));
                          try { clearCachedUrl(videoId); } catch (Exception ignored) {}
                          late = null;
                      }
                      if (late != null && !late.isEmpty()) {
                          diag("resolve cache " + describeStreamUrl(late));
                          out.url = late; out.resolvedVideoId = videoId; out.kind = KIND_OK;
                      } else {
                          out.kind = KIND_TRANSIENT; out.message = "Resolve timed out";
                      }
                  } catch (Exception e) {
                      out.kind = KIND_TRANSIENT; out.message = String.valueOf(e);
                  }
                  if (out.kind == KIND_DEAD) markDeadId(videoId);
                  return out;
              }
              private int currentIndex = -1;
              /* v2.2.108: next-track AUDIO preload. The player may hold a
                 second media item — the effective next track, its URL
                 resolved through resolveShared exactly like a played URL —
                 so its bytes download while the current track plays and
                 the boundary arrives with a banked cushion. Until now a
                 track's download only STARTED at its boundary, and on his
                 connection the first ~30-40s of a fresh download crawl
                 (~4 KB/s against a ~35 KB/s sustained rate); with the
                 buffer empty at every track start, that crawl was the
                 one-stall-per-song at the beginning of album tracks.
                 preloadedIndex / preloadedVideoId / preloadedUrl describe
                 the appended item (-1 / "" when the player holds one
                 item). landingPlayGen is the playGen of a playAtInternal
                 whose setMediaItem has not landed yet — while it is set,
                 an auto-transition must not adopt bookkeeping, because
                 the command owns the window and rebuilds it.
                 autoAdvancedIndex / autoAdvancedGen record the boundary
                 the player last crossed by auto-transition, so a command
                 that was entered BEFORE that crossing and lands behind
                 it can adopt the already-playing item instead of
                 restarting it (see playAtInternal). Repeat-one suppresses
                 the append entirely (see schedulePreloadNext): it keeps
                 its single-item fresh-resolve replay, unchanged. */
              private volatile int preloadedIndex = -1;
              private volatile String preloadedVideoId = "";
              private volatile String preloadedUrl = "";
              private volatile long landingPlayGen = -1;
              private volatile int autoAdvancedIndex = -1;
              private volatile long autoAdvancedGen = -1;
              private UiListener ui;
              /* v2.2.102: previous playback state, so the player listener
                 can log STATE_BUFFERING exits (see onPlaybackStateChanged). */
              private int lastPlaybackState = Player.STATE_IDLE;
              /* v2.2.5: native repeat mode (0=off, 1=all, 2=one), set by the web page. */
              private int repeatMode = 0;

              private final Runnable progressTick = new Runnable() {
                  @Override public void run() {
                      boolean playing = false;
                      try { playing = player != null && player.isPlaying(); } catch (Exception ignored) {}
                      /* v2.2.110: snapshot the player's buffered-ahead for
                         the banking yield policy. Player reads stay on this
                         (main) thread; the banking worker only reads these
                         volatiles, so the yield check never touches the
                         player off-thread. */
                      try {
                          if (player != null) {
                              bankBufferedAheadMs = Math.max(0L,
                                  player.getBufferedPosition() - player.getCurrentPosition());
                              bankPlayerWants = player.getPlayWhenReady();
                          } else {
                              bankBufferedAheadMs = 0;
                              bankPlayerWants = false;
                          }
                      } catch (Exception ignored) {}
                      /* v2.1.6: don't churn the CPU every second when paused or
                         idle — tick rarely just to keep the UI honest. */
                      if (playing) pushProgress();
                      main.postDelayed(this, playing ? 1000 : 5000);
                  }
              };

              // ---- v2.2.110: download-and-bank ----
              /* The rebuild the v2.2.109 failure pointed to. media3's
                 playlist preload is best-effort behind the current item's
                 needs in the shared buffer, so on this connection the
                 preloaded next track held ~0 bytes when a skip landed on
                 it. Instead, upcoming tracks are banked to DISK, fully,
                 ahead of time:
                 - initMediaCache builds ONE SimpleCache (128 MB LRU, app
                   cache dir). The player is built with a CacheDataSource
                   over it (read/write-through, FLAG_IGNORE_CACHE_ON_ERROR
                   only — the player never blocks behind the banking
                   writer; the block-on-cache flag is never set), keyed by a
                   CacheKeyFactory that maps each stream URL back to its
                   videoId, so every item addresses the cache as
                   "lmv_" + videoId no matter which expiring URL a resolve
                   handed out. The banking writer sets the same key
                   explicitly on its DataSpec (cacheKeyFor — one
                   computation, both paths).
                 - The banking worker below (single thread, at most one
                   CacheWriter download at a time; total network users:
                   the player + this writer) banks the effective next
                   track IN FULL, then the one after it. Targets always
                   derive from the freshest queue state; any queue-context
                   change bumps bankEpoch and cancels the in-flight writer,
                   and a stale target is abandoned, never finished.
                 - YIELD POLICY: while the player wants to play and its
                   buffered-ahead (snapshotted by progressTick on the main
                   thread) is below 25 s, the writer must not download —
                   checked before each target and inside the writer's
                   progress listener (which cancels the writer; cached
                   spans persist, so resuming continues where it stopped).
                   Only state changes are logged: 'bank yield' /
                   'bank resume'.
                 - Completion is verified before it is claimed: 'banked
                   idx=<n>' only after CacheWriter.cache() returns (and,
                   when the content length is known, the cached bytes
                   cover it). Failures log 'bank failed idx=<n>' and are
                   not retried until the next natural trigger (track start,
                   queue push, album-open signal) starts a fresh pass.
                 - Album-open browse banking: bankBrowse() hands the
                   worker an opened album's first two tracks. Browse
                   targets are attempted ONLY when the playing queue has
                   nothing left to bank — the playing queue always wins;
                   browse fills an idle worker and never displaces it. */
              private final ExecutorService bankExec = Executors.newSingleThreadExecutor();
              private final java.util.concurrent.atomic.AtomicBoolean bankRunning =
                      new java.util.concurrent.atomic.AtomicBoolean(false);
              private final java.util.concurrent.atomic.AtomicBoolean bankKickPending =
                      new java.util.concurrent.atomic.AtomicBoolean(false);
              private final java.util.concurrent.atomic.AtomicLong bankEpoch =
                      new java.util.concurrent.atomic.AtomicLong(0);
              private volatile CacheWriter bankWriter;
              private volatile long bankBufferedAheadMs = 0;
              private volatile boolean bankPlayerWants = false;
              private volatile boolean bankYielding = false;
              private volatile List<Track> browseBank;

              private static class BankTarget {
                  final int idx;
                  final String videoId;
                  final String title;
                  final String artist;
                  final boolean browse;
                  final long epoch;
                  BankTarget(int idx, String videoId, String title, String artist, boolean browse, long epoch) {
                      this.idx = idx; this.videoId = videoId; this.title = title;
                      this.artist = artist; this.browse = browse; this.epoch = epoch;
                  }
              }

              /* Builds the singleton cache + the player's cache data
                 source factory. Called once from onCreate before the
                 player is built. Any failure leaves both fields null and
                 playback falls back to plain streaming, exactly as
                 before v2.2.110. */
              private synchronized void initMediaCache() {
                  if (mediaCache != null) return;
                  try {
                      File dir = new File(getCacheDir(), "lm_media_cache");
                      SimpleCache sc = new SimpleCache(dir,
                              new LeastRecentlyUsedCacheEvictor(128L * 1024L * 1024L),
                              new StandaloneDatabaseProvider(this));
                      mediaCache = sc;
                      CacheKeyFactory keyFactory = new CacheKeyFactory() {
                          @Override public String buildCacheKey(DataSpec dataSpec) {
                              /* An explicit key (the banking writer's)
                                 wins as-is. The player sets none, so its
                                 items are keyed by the videoId the URL was
                                 resolved for — stable across re-resolves. */
                              if (dataSpec.key != null) return dataSpec.key;
                              String vid = (dataSpec.uri != null) ? videoIdForUrl(String.valueOf(dataSpec.uri)) : null;
                              if (vid != null && !vid.isEmpty()) return cacheKeyFor(vid);
                              return CacheKeyFactory.DEFAULT.buildCacheKey(dataSpec);
                          }
                      };
                      cacheDsFactory = new CacheDataSource.Factory()
                              .setCache(sc)
                              .setUpstreamDataSourceFactory(new DefaultDataSource.Factory(this))
                              .setCacheKeyFactory(keyFactory)
                              .setFlags(CacheDataSource.FLAG_IGNORE_CACHE_ON_ERROR);
                      diag("media cache ready");
                  } catch (Exception e) {
                      mediaCache = null;
                      cacheDsFactory = null;
                      diag("media cache init failed " + shorten(String.valueOf(e)));
                  }
              }

              /* Album-open signal (page -> AudioBridge.bankBrowse): the
                 first two tracks of an opened album/playlist, as a browse
                 context — NOT a play. Stored capped at two; the worker
                 banks them only when the playing queue leaves it idle. */
              public void bankBrowse(String tracksJson) {
                  try {
                      List<Track> parsed = parseTracks(tracksJson);
                      List<Track> first = new ArrayList<>();
                      for (int i = 0; i < parsed.size() && first.size() < 2; i++) {
                          Track tr = parsed.get(i);
                          if (tr != null && tr.videoId != null && !tr.videoId.isEmpty()) first.add(tr);
                      }
                      if (first.isEmpty()) return;
                      browseBank = first;
                      bankContextChanged();
                  } catch (Exception ignored) {}
              }

              /* Every queue-context change funnels here: the epoch bump
                 invalidates in-flight targets, the current writer (if any)
                 is cancelled, and the worker re-derives targets from the
                 freshest state. */
              private void bankContextChanged() {
                  bankEpoch.incrementAndGet();
                  CacheWriter w = bankWriter;
                  if (w != null) { try { w.cancel(); } catch (Exception ignored) {} }
                  kickBanking();
              }

              private void kickBanking() {
                  if (mediaCache == null || cacheDsFactory == null) return;
                  if (!bankRunning.compareAndSet(false, true)) {
                      /* A pass is already running (it re-derives targets
                         from the freshest state itself). Remember that a
                         trigger arrived, so the pass re-checks once on its
                         way out instead of losing a trigger that lands in
                         the exit window. */
                      bankKickPending.set(true);
                      return;
                  }
                  try {
                      bankExec.execute(new Runnable() {
                          @Override public void run() {
                              try { bankLoop(); } catch (Exception ignored) {}
                              bankRunning.set(false);
                              if (bankKickPending.getAndSet(false)) kickBanking();
                          }
                      });
                  } catch (Exception e) {
                      bankRunning.set(false);
                  }
              }

              private void bankLoop() {
                  /* One pass. A target that fails in this pass is not
                     retried within it; the next natural trigger starts a
                     fresh pass with a fresh failed set. */
                  java.util.Set<String> failedThisPass = new java.util.HashSet<>();
                  while (true) {
                      BankTarget t = nextBankTarget(failedThisPass);
                      if (t == null) return;
                      bankOne(t, failedThisPass);
                  }
              }

              /* The freshest target, or null when there is nothing to do.
                 Playing queue first: the effective next after the current
                 track, then the one after that (same repeat-aware walk
                 the preload window uses, minus the currently playing
                 track itself). Browse targets only when the playing
                 queue yields nothing — it always wins. */
              private BankTarget nextBankTarget(java.util.Set<String> failed) {
                  long ep = bankEpoch.get();
                  try {
                      if (currentIndex >= 0 && currentIndex < queue.size()) {
                          int n1 = effectiveNextIndex(currentIndex);
                          int[] chain = { n1, (n1 >= 0 ? effectiveNextIndex(n1) : -1) };
                          for (int k = 0; k < chain.length; k++) {
                              int idx = chain[k];
                              if (idx < 0 || idx >= queue.size() || idx == currentIndex) continue;
                              if (idx == chain[0] && k == 1) continue;
                              Track tr = queue.get(idx);
                              if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                              if (failed.contains(tr.videoId)) continue;
                              if (isBanked(tr.videoId)) continue;
                              return new BankTarget(idx, tr.videoId, tr.title, tr.channel, false, ep);
                          }
                      }
                  } catch (Exception ignored) {}
                  try {
                      List<Track> bb = browseBank;
                      if (bb != null) {
                          for (int i = 0; i < bb.size(); i++) {
                              Track tr = bb.get(i);
                              if (tr == null || tr.videoId == null || tr.videoId.isEmpty()) continue;
                              if (failed.contains(tr.videoId)) continue;
                              if (isBanked(tr.videoId)) continue;
                              return new BankTarget(i, tr.videoId, tr.title, tr.channel, true, ep);
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private boolean stillWanted(BankTarget t) {
                  if (t.epoch != bankEpoch.get()) return false;
                  try {
                      if (t.browse) {
                          List<Track> bb = browseBank;
                          return bb != null && t.idx >= 0 && t.idx < bb.size()
                                  && bb.get(t.idx) != null && t.videoId.equals(bb.get(t.idx).videoId);
                      }
                      return t.idx >= 0 && t.idx < queue.size()
                              && queue.get(t.idx) != null && t.videoId.equals(queue.get(t.idx).videoId);
                  } catch (Exception ignored) {}
                  return false;
              }

              private boolean bankYieldNow() {
                  /* The player gets the pipe to itself while it is trying
                     to play and holds less than 25 s of buffered-ahead.
                     Paused / idle: the writer may run freely (that is the
                     album-open case). */
                  return bankPlayerWants && bankBufferedAheadMs < 25000;
              }

              private void setBankYield(boolean y) {
                  if (y == bankYielding) return;
                  bankYielding = y;
                  diag(y ? "bank yield" : "bank resume");
              }

              private long bankContentLength(String key) {
                  try {
                      Cache c = mediaCache;
                      if (c == null) return -1;
                      return ContentMetadata.getContentLength(c.getContentMetadata(key));
                  } catch (Exception ignored) {}
                  return -1;
              }

              /* Verified completion only: the content length is known and
                 the cached bytes cover it end to end. */
              private boolean isBanked(String videoId) {
                  try {
                      Cache c = mediaCache;
                      if (c == null || videoId == null || videoId.isEmpty()) return false;
                      String key = cacheKeyFor(videoId);
                      long len = bankContentLength(key);
                      if (len <= 0) return false;
                      return c.getCachedBytes(key, 0, len) >= len;
                  } catch (Exception ignored) {}
                  return false;
              }

              private void bankOne(final BankTarget t, java.util.Set<String> failedThisPass) {
                  if (isBanked(t.videoId)) return;
                  /* Resolves go through the same choke point as playback:
                     single-flight, video-mime rejection, diag logging. A
                     failed resolve aborts this bank cleanly. */
                  ResolveResult rr = resolveShared(t.videoId, t.title, t.artist);
                  if (rr == null || rr.kind != KIND_OK || rr.url == null || rr.url.isEmpty()) {
                      diag("bank failed idx=" + t.idx + " reason=resolve");
                      failedThisPass.add(t.videoId);
                      return;
                  }
                  final String vid = (rr.resolvedVideoId != null && !rr.resolvedVideoId.isEmpty())
                          ? rr.resolvedVideoId : t.videoId;
                  if (isBanked(vid)) return;
                  if (rr.url.contains(".m3u8") || rr.url.contains("/api/manifest/")) {
                      /* A CacheWriter over an HLS manifest would "bank"
                         the playlist file, not the audio — refuse and let
                         playback stream it live as it does today. */
                      diag("bank failed idx=" + t.idx + " reason=hls");
                      failedThisPass.add(t.videoId);
                      return;
                  }
                  final String key = cacheKeyFor(vid);
                  final DataSpec spec = new DataSpec.Builder().setUri(rr.url).setKey(key).build();
                  while (true) {
                      if (!stillWanted(t)) { bankYielding = false; return; }
                      if (bankYieldNow()) {
                          setBankYield(true);
                          try { Thread.sleep(1200); } catch (Exception ignored) {}
                          continue;
                      }
                      setBankYield(false);
                      final CacheWriter[] holder = new CacheWriter[1];
                      CacheWriter.ProgressListener pl = new CacheWriter.ProgressListener() {
                          @Override public void onProgress(long requestLength, long bytesCached, long newBytesCached) {
                              /* Cooperative yield + retarget: cancelling
                                 makes cache() throw InterruptedIOException;
                                 spans already written stay in the cache, so
                                 a later writer for the same key resumes
                                 where this one stopped. */
                              if (holder[0] != null && (!stillWanted(t) || bankYieldNow())) {
                                  try { holder[0].cancel(); } catch (Exception ignored) {}
                              }
                          }
                      };
                      CacheWriter w;
                      try {
                          w = new CacheWriter(cacheDsFactory.createDataSource(), spec, null, pl);
                      } catch (Exception e) {
                          diag("bank failed idx=" + t.idx + " reason=writer");
                          failedThisPass.add(t.videoId);
                          return;
                      }
                      holder[0] = w;
                      bankWriter = w;
                      try {
                          w.cache();
                      } catch (java.io.InterruptedIOException e) {
                          /* Yielded or retargeted — the loop re-evaluates
                             against the freshest state. */
                          bankWriter = null;
                          continue;
                      } catch (Exception e) {
                          bankWriter = null;
                          diag("bank failed idx=" + t.idx + " reason=io");
                          failedThisPass.add(t.videoId);
                          return;
                      }
                      bankWriter = null;
                      /* cache() returned: the requested data is cached.
                         When the content length is known, verify the
                         bytes actually cover it before claiming banked. */
                      if (bankContentLength(key) > 0 && !isBanked(vid)) {
                          diag("bank failed idx=" + t.idx + " reason=short");
                          failedThisPass.add(t.videoId);
                          return;
                      }
                      diag("banked idx=" + t.idx);
                      return;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return binder; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  try { NewPipe.init(new ExtractorDownloader()); } catch (Exception ignored) {}
                  /* v2.2.101: every service (re)start leaves a marker with
                     the device facts and the battery-exemption state, so the
                     Playback log can show whether the OS layer was free to
                     stop this process with the screen off. */
                  diag("service start - " + android.os.Build.MANUFACTURER + " " + android.os.Build.MODEL
                          + " - SDK " + Build.VERSION.SDK_INT + " - batteryExempt=" + batteryExemptStr(this));
                  /* v2.2.105: deeper buffer — his connection delivers
                     ~35 KB/s in bursts, and the stock load control only
                     asks for ~5s of audio before resuming after a stall,
                     so a thin pipe stop-started every few seconds. Now a
                     stall refills ~15s before playback resumes and the
                     player targets 50-90s of buffered audio (about 1 MB
                     at the capped stream rate). Standard knobs only.
                     v2.2.109: the startup cushion joins it — a track banks
                     ~12s before it may start (was ~2.5s) and a stall refills
                     ~30s before playback resumes (was ~15s), so the
                     connection's slow first stretch is spent in the starting
                     wait instead of a few seconds into the song (the
                     album-opener stall the next-track preload can't cover).
                     v2.2.110: the cushion is REVERTED (2500 / 5000) — it
                     backfired on device: stall length = target / delivery
                     rate, so the 12s start target meant a 35s silent load
                     and the 30s refill a 65s stall. Smooth starts now come
                     from the download-and-bank cache below (tracks banked
                     to disk ahead of their boundary), not from deeper
                     starting gates. The 50s/90s targets stay. */
                  initMediaCache();
                  ExoPlayer.Builder playerBuilder = new ExoPlayer.Builder(this)
                          .setLoadControl(new androidx.media3.exoplayer.DefaultLoadControl.Builder()
                                  .setBufferDurationsMs(50000, 90000, 2500, 5000)
                                  .build());
                  /* v2.2.110: play through the disk cache when it is up —
                     a banked track starts from local spans and the player
                     keeps banking whatever it streams for next time. */
                  if (cacheDsFactory != null) {
                      playerBuilder.setMediaSourceFactory(new DefaultMediaSourceFactory(this)
                              .setDataSourceFactory(cacheDsFactory));
                  }
                  player = playerBuilder.build();
                  /* v2.2.7: media session — routes Bluetooth headset play/pause/next/prev.
                     Next/prev go to the app queue (the player holds one item at a time).
                     v2.2.8: advertise next/prev commands — the single-item player
                     doesn't offer them by default, so headsets never send them. */
                  try {
                      /* v2.2.13: set a session activity so the system keeps the
                         media session alive and routes Bluetooth buttons reliably. */
                      PendingIntent sessionActivity = null;
                      try {
                          Intent launchIntent = new Intent(this, MainActivity.class);
                          launchIntent.setAction(Intent.ACTION_MAIN);
                          launchIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                          int sessFlags = PendingIntent.FLAG_UPDATE_CURRENT;
