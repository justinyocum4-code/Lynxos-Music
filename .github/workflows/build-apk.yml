                                                      action = new Runnable() {
                                                          @Override public void run() { toggleInternal("bt/session"); }
                                                      };
                                                  }
                                                  long now = android.os.SystemClock.uptimeMillis();
                                                  if (lastCmdDir[0] != 0 && dir == -lastCmdDir[0]
                                                          && now - lastCmdAt[0] < 800) {
                                                      diag("cmd suppressed src=bt/session (echo)");
                                                      return true;
                                                  }
                                                  lastCmdAt[0] = now;
                                                  lastCmdDir[0] = dir;
                                                  main.post(action);
                                                  return true;
                                              }
                                              /* v2.2.104: MEDIA_STOP — handled for the
                                                 first time (it used to fall through to
                                                 media3, which stops the player outright,
                                                 unlogged). The app-appropriate stop is
                                                 a pause: the queue and the loaded track
                                                 stay in place, so a later play resumes
                                                 this song instead of facing an unloaded
                                                 player. Not direction-gated — stop is
                                                 neither play-ward nor a toggle. */
                                              if (kc == KeyEvent.KEYCODE_MEDIA_STOP) {
                                                  main.post(new Runnable() {
                                                      @Override public void run() { pauseOnlyInternal("bt/session"); }
                                                  });
                                                  return true;
                                              }
                                              /* v2.2.104: ANY other media-session keycode
                                                 (rewind, fast-forward, record, close,
                                                 eject, step, navigate...) — consume and
                                                 log it, so media3's default handling can
                                                 never apply it to the player behind the
                                                 app's back. Through v2.2.103 every one
                                                 of these fell through, unlogged and
                                                 undebounced. */
                                              if (isMediaKeyCode(kc)) {
                                                  diag("bt key ignored keycode=" + kc);
                                                  return true;
                                              }
                                              /* Not a media keycode at all — not ours. */
                                              fallReason = "nonmedia";
                                          } else {
                                              /* Not ACTION_DOWN (an ACTION_UP in
                                                 practice): behavior unchanged from
                                                 every prior version — the session
                                                 realistically only delivers ACTION_DOWN
                                                 here — but it now leaves a log line on
                                                 its way to the tail. */
                                              fallReason = "action";
                                          }
                                      }
                                  } catch (Exception e) { fallReason = "exception"; }
                                  /* v2.2.104: the ONLY remaining road to media3
                                     default handling, and it is never silent: the
                                     parcelable held no KeyEvent ("extract"), an
                                     exception fired mid-handling ("exception"), the
                                     event was not ACTION_DOWN ("action"), or the
                                     keycode is not a media key ("nonmedia"). */
                                  diag("bt fallthrough reason=" + fallReason);
                                  return MediaSession.Callback.super.onMediaButtonEvent(session, controllerInfo, mediaButtonEvent);
                              }
                              @Override
                              public int onPlayerCommandRequest(MediaSession session, MediaSession.ControllerInfo controller, int playerCommand) {
                                  try {
                                      /* v2.2.104: THIS CALLBACK IS A VETO GATE, NOT AN
                                         EXECUTOR — the audit's conviction, verified
                                         against the media3 1.4.1 sources. Returning
                                         RESULT_SUCCESS makes the LIBRARY apply the
                                         command to the player itself; any other result
                                         code skips the application (MediaSessionStub:
                                         "Don't run rejected command"). Through
                                         v2.2.103 the PLAY_PAUSE branch ALSO posted
                                         the app's own state-based toggle, so every
                                         controller play/pause executed TWICE under
                                         two semantics — and on the legacy (Bluetooth/
                                         framework) path the library's directional
                                         apply ran synchronously INSIDE this call, so
                                         the posted toggle read the already-flipped
                                         state and REVERSED the command: a controller
                                         pause ended resumed, a play ended paused,
                                         unless the toggle happened to be debounce-
                                         suppressed. Oct 12's "tap to pause stops for
                                         about a second then keeps playing" and
                                         "controls work sometimes when they want to,"
                                         mechanistically. From here on: exactly ONE
                                         executor per command. */
                                      if (playerCommand == Player.COMMAND_PLAY_PAUSE) {
                                          /* Pass-through: NO app execution and NO
                                             debounce clock — the library applies the
                                             controller's play() or pause()
                                             directionally, exactly once. The page and
                                             notification stay in sync through the
                                             player listener (onIsPlayingChanged ->
                                             pushProgress/updateNotification fires for
                                             ANY state change, whatever its source),
                                             never through this gate. */
                                          diag("gate play_pause (pass-through)");
                                          return SessionResult.RESULT_SUCCESS;
                                      }
                                      if (playerCommand == Player.COMMAND_SEEK_TO_NEXT) {
                                          /* Veto-and-execute — correct ONLY here: the
                                             page owns queue policy (shuffle/repeat/
                                             radio), so the app runs its single
                                             page-or-fallback path itself and vetoes
                                             with NOT_SUPPORTED so the library does
                                             not also apply its seek (a no-op on this
                                             single-item player today, but SUCCESS
                                             would still mean "also applied"). */
                                          diag("gate seek_next (veto+app)");
                                          main.post(new Runnable() {
                                              @Override public void run() {
                                                  UiListener l = ui;
                                                  boolean consumed = false;
                                                  if (l != null) { try { consumed = l.onNotifNext(); } catch (Exception ignored) {} }
                                                  if (!consumed) playAtInternal(currentIndex + 1);
                                              }
                                          });
                                          return SessionResult.RESULT_ERROR_NOT_SUPPORTED;
                                      }
                                      if (playerCommand == Player.COMMAND_SEEK_TO_PREVIOUS) {
                                          diag("gate seek_prev (veto+app)");
                                          main.post(new Runnable() {
                                              @Override public void run() {
                                                  UiListener l = ui;
                                                  boolean consumed = false;
                                                  if (l != null) { try { consumed = l.onNotifPrev(); } catch (Exception ignored) {} }
                                                  if (!consumed) playAtInternal(currentIndex - 1);
                                              }
                                          });
                                          return SessionResult.RESULT_ERROR_NOT_SUPPORTED;
                                      }
                                      /* Every other command keeps the library
                                         default (the super return below) — but it
                                         is now visible in the Playback log first. */
                                      diag("gate cmd=" + playerCommand + " (default)");
                                  } catch (Exception ignored) {}
                                  return MediaSession.Callback.super.onPlayerCommandRequest(session, controller, playerCommand);
                              }
                          });
                      if (sessionActivity != null) {
                          try { sessionBuilder.setSessionActivity(sessionActivity); } catch (Exception ignored) {}
                      }
                      mediaSession = sessionBuilder.build();
                  } catch (Exception ignored) {}
                  try {
                      player.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.CONTENT_TYPE_MUSIC)
                              .build(), false); /* v2.2.99: was true — the app now manages audio focus itself (focusListener above), so ExoPlayer must not auto-pause/auto-resume */
                  } catch (Exception ignored) {}
                  try { player.setWakeMode(C.WAKE_MODE_NETWORK); } catch (Exception ignored) {}
                  player.addListener(new Player.Listener() {
                      @Override public void onPlaybackStateChanged(int state) {
                          /* v2.2.102: buffering windows go to the Playback
                             log. In v2.2.101 they were invisible there, and
                             a buffering stall is exactly what the reported
                             play/pause cycling turned out to be — the log
                             must be able to see the thing it diagnosed.
                             Entry logs the buffered position (ms); the exit
                             line fires on the first state change away from
                             BUFFERING. */
                          if (state == Player.STATE_BUFFERING) {
                              long bufPos = -1;
                              try { bufPos = player.getBufferedPosition(); } catch (Exception ignored) {}
                              diag("buffering start buf=" + bufPos + "ms");
                          } else if (lastPlaybackState == Player.STATE_BUFFERING) {
                              diag("buffering end");
                          }
                          lastPlaybackState = state;
                          if (state == Player.STATE_ENDED) {
                              /* v2.2.101: the boundary marker — the advance
                                 outcome lines that follow this entry
                                 ("started", "resolve failed", "floor
                                 engaged"...) are the Playback log's core
                                 evidence for the screen-off stall. */
                              diag("track ended idx=" + currentIndex);
                              /* v2.2.9: advance natively IMMEDIATELY. The 3s delayed
                                 fallback wasn't reliable — the WebView can partially
                                 wake and confuse the state check. Native is now the
                                 single source of truth for advancing; JS just syncs UI. */
                              advanceAfterEnded(currentIndex, repeatMode);
                              UiListener l = ui;
                              if (l != null) { try { l.onTrackEnded(); } catch (Exception ignored) {} }
                          } else if (state == Player.STATE_READY) {
                              /* v2.2.79: Clear retry counter on successful playback */
                              try {
                                  if (currentIndex >= 0 && currentIndex < queue.size()) {
                                      Track t = queue.get(currentIndex);
                                      String key = t.videoId + "_" + currentIndex;
                                      synchronized (retryCount) { retryCount.remove(key); }
                                  }
                              } catch (Exception ignored) {}
                              updateNotification();
                          }
                      }
                      /* v2.2.108: an AUTO media-item transition is a track
                         boundary whose driver is the player itself. The
                         ONLY way one can occur is the appended preload item
                         (the player otherwise holds a single item, and its
                         own repeat mode is never enabled), so this handler
                         adopts the crossing as THE advance for that
                         boundary — the same bookkeeping a playAtInternal
                         advance performs (currentIndex/gen move, page sync
                         via onTrackEnded + onTrackChanged, prefetch, locks)
                         — and then rolls the window forward. While a
                         playAtInternal is landing (landingPlayGen set), the
                         command owns the window: the crossing is noted and
                         left alone, and the command's setMediaItem rebuilds
                         everything. STATE_ENDED never fires for a boundary
                         crossed this way, so advanceAfterEnded can never
                         double-drive it; a boundary the preload didn't
                         cover still ends the playlist and takes the
                         STATE_ENDED path exactly as before. */
                      @Override public void onMediaItemTransition(MediaItem mediaItem, int reason) {
                          if (reason != Player.MEDIA_ITEM_TRANSITION_REASON_AUTO) return;
                          try {
                              if (player == null) return;
                              if (landingPlayGen != -1) {
                                  diag("advance auto (superseded by command)");
                                  return;
                              }
                              int newIdx = -1;
                              if (preloadedIndex >= 0 && preloadedIndex < queue.size()
                                      && queue.get(preloadedIndex) != null
                                      && preloadedVideoId != null
                                      && preloadedVideoId.equals(queue.get(preloadedIndex).videoId)) {
                                  newIdx = preloadedIndex;
                              } else if (currentIndex + 1 < queue.size()) {
                                  /* Orphan path: an appended item outlived
                                     its bookkeeping (a removal failed
                                     somewhere). Adopt the sequential next
                                     only if the player's new current item is
                                     provably that track's cached URL. */
                                  Track nt = queue.get(currentIndex + 1);
                                  String cu = (nt != null && nt.videoId != null) ? getCachedUrl(nt.videoId) : null;
                                  if (cu != null && !cu.isEmpty() && cu.equals(currentMediaUrl())) {
                                      newIdx = currentIndex + 1;
                                      diag("advance auto (orphan) idx=" + newIdx);
                                  }
                              }
                              if (newIdx < 0) { diag("advance auto (untracked)"); return; }
                              preloadedIndex = -1; preloadedVideoId = ""; preloadedUrl = "";
                              /* Drop the finished item (it sits before the
                                 current one) so the player again holds just
                                 the current track. */
                              try {
                                  int cur = player.getCurrentMediaItemIndex();
                                  if (cur > 0 && player.getMediaItemCount() > cur) player.removeMediaItem(0);
                              } catch (Exception ignored) {}
                              currentIndex = newIdx;
                              /* The auto-advance IS the current play now: a
                                 fresh generation, so floors armed for the
                                 previous track stand down and an error on
                                 this track keys to this play. */
                              currentPlayGen = playGen.incrementAndGet();
                              autoAdvancedIndex = newIdx;
                              autoAdvancedGen = currentPlayGen;
                              diag("advance auto idx=" + newIdx);
                              acquirePlayLocks();
                              updateNotification();
                              pushProgress();
                              UiListener l = ui;
                              if (l != null) { try { l.onTrackEnded(); } catch (Exception ignored) {} }
                              if (l != null) { try { l.onTrackChanged(newIdx); } catch (Exception ignored) {} }
                              /* Same warm-up + window roll as a commanded
                                 track start. */
                              prefetchNext(newIdx + 1);
                              prefetchNext(newIdx + 2);
                              prefetchNext(newIdx + 3);
                              schedulePreloadNext(newIdx, playGen.get());
                              /* v2.2.110: an adopted boundary is a banking
                                 context change too — the window rolled, so
                                 the banking targets roll with it. */
                              bankContextChanged();
                          } catch (Exception ignored) {}
                      }
                      @Override public void onIsPlayingChanged(boolean isPlaying) {
                          /* v2.2.102: the transition itself is logged — it
                             is what flips the mini-player icon between play
                             and pause, and in v2.2.101 nothing recorded it,
                             so minutes of icon-flapping left no trace. */
                          diag("isPlaying=" + isPlaying);
                          updateNotification();
                          pushProgress();
                      }
                      @Override public void onPlayWhenReadyChanged(boolean playWhenReady, int reason) {
                          /* v2.2.104: EVERY playWhenReady flip now leaves a
                             line, with its media3 reason. Before this, a flip
                             applied by the media library itself (a controller
                             command the gate passed through, or a fall-through
                             default) changed nothing the Playback log watched
                             — isPlaying was often already false (mid-buffer)
                             and no "cmd" line exists for library actions — so
                             the player could sit silently paused behind a
                             completely clean log: the v2.2.103 episode that
                             convicted the gate. Reason names are the media3
                             1.4.1 Player.PlayWhenReadyChangeReason constants.
                             REMOTE is the class a library/controller-applied
                             flip carries; USER_REQUEST covers in-app
                             setPlayWhenReady calls (the app's own play()/
                             pause() included). diag() itself can never throw
                             into the listener (its body is fully guarded). */
                          diag("playWhenReady=" + playWhenReady + " reason=" + playWhenReadyReasonName(reason));
                      }
                      @Override public void onPlayerError(PlaybackException error) {
                          /* v2.2.108: boundary-error reconcile. If the player
                             has moved onto the appended preload item — i.e.
                             this error is the PRELOADED track failing at its
                             boundary (its URL is the player's current one)
                             while the service still counts the previous
                             track as current — adopt the preloaded track as
                             current first, so the retry/skip machinery below
                             works on the track that actually failed instead
                             of restarting the one that just ended. (If the
                             AUTO transition was already adopted above, this
                             is a plain current-track error and the reconcile
                             does not trigger: preloadedIndex no longer names
                             the failing item.) */
                          try {
                              if (preloadedIndex >= 0 && currentIndex != preloadedIndex && player != null
                                      && preloadedUrl != null && !preloadedUrl.isEmpty()
                                      && preloadedUrl.equals(currentMediaUrl())) {
                                  int errIdx = preloadedIndex;
                                  preloadedIndex = -1; preloadedVideoId = ""; preloadedUrl = "";
                                  try {
                                      int cur = player.getCurrentMediaItemIndex();
                                      if (cur > 0) player.removeMediaItem(0);
                                  } catch (Exception ignored) {}
                                  currentIndex = errIdx;
                                  currentPlayGen = playGen.incrementAndGet();
                                  autoAdvancedIndex = errIdx;
                                  autoAdvancedGen = currentPlayGen;
                                  diag("advance auto (error boundary) idx=" + errIdx);
                              }
                          } catch (Exception ignored) {}
                          String msg = "";
                          try { msg = String.valueOf(error.getMessage()); } catch (Exception ignored) {}
                          /* v2.2.101: mirror the error into the Playback log. */
                          diag("player error idx=" + currentIndex + " " + shorten(msg));
                          /* v2.2.100: the generation of the play that is
                             erroring — a native floor scheduled below is
                             keyed to it, so any newer play stands it down. */
                          final long errGen = currentPlayGen;
                          /* v2.2.79: Retry with fresh URL before skipping.
                             Cached URLs expire; a fresh resolve often fixes it. */
                          try {
                              if (currentIndex >= 0 && currentIndex < queue.size()) {
                                  Track t = queue.get(currentIndex);
                                  String key = t.videoId + "_" + currentIndex;
                                  int retries = 0;
                                  synchronized (retryCount) {
                                      Integer r = retryCount.get(key);
                                      retries = (r != null) ? r : 0;
                                  }
                                  if (retries < MAX_RETRIES) {
                                      synchronized (retryCount) { retryCount.put(key, retries + 1); }
                                      /* Clear stale cached URL and retry same track.
                                         v2.2.98: resolve the fresh URL FIRST (250ms
                                         delay, was a blind 1000ms) — if it comes back
                                         identical to the URL that just failed, don't
                                         waste the retry on it; fall to the error path. */
                                      clearCachedUrl(t.videoId);
                                      android.util.Log.i("LynxosMusic", "Retrying track " + currentIndex + " (attempt " + (retries + 1) + ")");
                                      final int retryIdx = currentIndex;
                                      final Track retryTrack = t;
                                      final String failedUrl = currentMediaUrl();
                                      /* v2.2.99: remember where the track broke —
                                         the retry resumes there instead of
                                         restarting the song from 0. */
                                      final long retryPosMs = (player != null) ? player.getCurrentPosition() : 0;
                                      bg.execute(new Runnable() {
                                          @Override public void run() {
                                              ResolveResult fresh = null;
                                              try { fresh = resolveShared(retryTrack.videoId, retryTrack.title, retryTrack.channel); } catch (Throwable ignored) {}
                                              final ResolveResult fr = fresh;
                                              main.postDelayed(new Runnable() {
                                                  @Override public void run() {
                                                      if (fr != null && fr.url != null && !fr.url.isEmpty() && fr.url.equals(failedUrl)) {
                                                          android.util.Log.w("LynxosMusic", "Fresh resolve returned the failed URL — not retrying it");
                                                          UiListener l = ui;
                                                          if (l != null) {
                                                              try { l.onTrackError("Playback failed."); } catch (Exception ignored) {}
                                                              /* v2.2.100: native retries are
                                                                 spent and the page got the
                                                                 error — if the page is frozen
                                                                 (screen off), nothing else
                                                                 would progress playback, so
                                                                 arm the native floor: a fresh
                                                                 resolve, then advance. */
                                                              scheduleNativeFloor(retryIdx, errGen, true, failedUrl);
                                                          }
                                                          else playAtInternal(currentIndex + 1);
                                                          return;
                                                      }
                                                      /* A good fresh URL is already in the
                                                         cache (resolveShared put it there),
                                                         so this play starts instantly.
                                                         v2.2.99: hand playAtInternal the
                                                         broken-at position to restore. */
                                                      if (retryPosMs > 0) { pendingSeekIndex = retryIdx; pendingSeekMs = retryPosMs; }
                                                      playAtInternal(retryIdx);
                                                  }
                                              }, 250);
                                          }
                                      });
                                      return;
                                  } else {
                                      /* Retries exhausted - clear counter and skip */
                                      synchronized (retryCount) { retryCount.remove(key); }
                                  }
                              }
                          } catch (Exception e) {
                              android.util.Log.w("LynxosMusic", "Retry logic failed", e);
                          }
                          UiListener l = ui;
                          if (l != null) {
                              try { l.onTrackError(msg); } catch (Exception ignored) {}
                              /* v2.2.100: same consumed trap as the resolve
                                 path — with the screen off, the page that
                                 just "handled" this error is frozen and
                                 playback stalls here. Arm the native floor
                                 (keyed to the errored play's generation): it
                                 retries once with a fresh resolve, then
                                 advances on its own, and stands down the
                                 moment the page or the user starts anything. */
                              scheduleNativeFloor(currentIndex, errGen, true, currentMediaUrl());
                          }
                          else { playAtInternal(currentIndex + 1); }
                      }
                  });
                  createChannel();
                  main.post(progressTick);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null) {
                      String a = intent.getAction();
                      UiListener l = ui;
                      if (ACT_TOGGLE.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifToggle(); } catch (Exception ignored) {} }
                          if (!consumed) toggleInternal("notification");
                      } else if (ACT_NEXT.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifNext(); } catch (Exception ignored) {} }
                          if (!consumed) playAtInternal(currentIndex + 1);
                      } else if (ACT_PREV.equals(a)) {
                          boolean consumed = false;
                          if (l != null) { try { consumed = l.onNotifPrev(); } catch (Exception ignored) {} }
                          if (!consumed) playAtInternal(currentIndex - 1);
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try { main.removeCallbacks(progressTick); } catch (Exception ignored) {}
                  try { bg.shutdownNow(); } catch (Exception ignored) {}
                  /* v2.2.110: stop the banking worker with the rest. */
                  try { bankExec.shutdownNow(); } catch (Exception ignored) {}
                  try { CacheWriter w = bankWriter; if (w != null) w.cancel(); } catch (Exception ignored) {}
                  /* v2.2.98: shut down the play + resolve executors too. */
                  try { playExec.shutdownNow(); } catch (Exception ignored) {}
                  try { resolveExec.shutdownNow(); } catch (Exception ignored) {}
                  /* v2.2.101: the session-lock watchdog dies with the service too. */
                  try { main.removeCallbacks(lockIdleWatchdog); } catch (Exception ignored) {}
                  /* v2.2.100: drop the play locks with the service. */
                  releasePlayLocks();
                  /* v2.2.99: give audio focus back. */
                  abandonAudioFocus();
                  /* v2.2.7: release the media session. */
                  try { if (mediaSession != null) mediaSession.release(); } catch (Exception ignored) {}
                  mediaSession = null;
                  try { if (player != null) player.release(); } catch (Exception ignored) {}
                  player = null;
                  /* v2.2.110: release the disk cache after the player —
                     the banked bytes stay on disk for the next start
                     (stable keys make them findable again). */
                  try { if (mediaCache != null) mediaCache.release(); } catch (Exception ignored) {}
                  mediaCache = null;
                  cacheDsFactory = null;
                  super.onDestroy();
              }

              public void setUiListener(UiListener l) { ui = l; }
              /* v2.2.5: the web page sets this when the user changes repeat mode. */
              public void setRepeatMode(int mode) {
                  repeatMode = mode;
                  /* v2.2.108: the appended next was derived under the OLD
                     mode (repeat-one suppresses it entirely; repeat-all may
                     wrap to the queue head) — drop it and re-derive under
                     the new mode, so a mode change mid-track can never let
                     a stale next item auto-play. */
                  if (preloadedIndex >= 0) {
                      dropPreloaded("repeat change");
                      if (currentIndex >= 0) schedulePreloadNext(currentIndex, playGen.get());
                  }
                  /* v2.2.110: repeat mode shapes the banking chain too
                     (repeat-one has no next to bank; repeat-all may wrap). */
                  bankContextChanged();
              }
              /* v2.2.5: advance the queue natively (screen-off safe).
                 v2.2.100: these plays are marked fromAdvance — they get the
                 long resolve deadline and the native failure floor, because
                 at a track boundary there may be nobody awake to recover a
                 failure (see playAtInternal / scheduleNativeFloor). */
              private void advanceAfterEnded(int endedIndex, int repeat) {
                  if (player == null) return;
                  /* v2.2.102: the native advance is a play-command arrival
                     too — tagged like the others (see pauseOnlyInternal). */
                  diag("cmd play src=advance");
                  if (repeat == 2) { playAtInternal(endedIndex, true); return; }
                  if (endedIndex + 1 < queue.size()) { playAtInternal(endedIndex + 1, true); return; }
                  if (repeat == 1 && !queue.isEmpty()) { playAtInternal(0, true); }
              }

              // ---- public API: call on the main thread ----

              public void playQueue(String tracksJson, int index) {
                  List<Track> t = parseTracks(tracksJson);
                  queue.clear();
                  queue.addAll(t);
                  /* v2.2.110: a fresh play replaces the browse context —
                     the playing queue owns the banking worker now. (The
                     banking kick itself fires from the play completion.) */
                  browseBank = null;
                  playAtInternal(index);
              }

              public void appendTracks(String tracksJson) {
                  queue.addAll(parseTracks(tracksJson));
                  /* v2.2.110: a longer queue can give the worker a target
                     it didn't have (e.g. the first append after a
                     one-track play). Kick only — appends never invalidate
                     the target already in flight. */
                  kickBanking();
              }

              public void playAt(int index) { playAtInternal(index); }

              /* v2.1.1: sync a JS-resolved videoId into the service queue
                 before playing (album tracks resolve on demand). */
              public void playTrackAt(final int index, final String videoId) {
                  main.post(new Runnable() {
                      @Override public void run() {
                          if (index >= 0 && index < queue.size() && videoId != null && !videoId.isEmpty()) {
                              queue.get(index).videoId = videoId;
                          }
                          playAtInternal(index);
                      }
                  });
              }

              public void toggle() { toggleInternal("page"); }

              public void pausePlayback() { pauseOnlyInternal("page"); }

              /* v2.2.99: explicit pause — used by the JS bridge pause and the
                 Bluetooth PAUSE key. It is NOT a toggle: a duplicated AVRCP
                 delivery can no longer un-pause, and pausing during buffering
                 now works (the old code checked isPlaying(), which stays false
                 until audio actually starts, so a "pause" mid-buffer did
                 nothing and the song then played anyway). A user pause also
                 clears the focus-pause flag: regaining audio focus must never
                 undo a pause the user made. */
              private void pauseOnlyInternal() { pauseOnlyInternal("internal"); }

              /* v2.2.102: src names the arrival path of the command —
                 "bt/session" (media-session callback), "notification"
                 (notification action fallback), "page" (JS bridge),
                 "focus" (audio-focus handler), "floor" (native failure
                 floor), "advance" (native ended-advance), "internal"
                 (anything else). v2.2.101's Playback log recorded no
                 command arrivals at all; every play/pause/toggle arrival
                 now leaves exactly one "cmd ..." line, so the next report
                 can tell a real command storm from a buffering stall. */
              private void pauseOnlyInternal(String src) {
                  diag("cmd pause src=" + src);
                  focusPaused = false;
                  /* v2.2.101: session-scoped locks — a user pause does NOT
                     release the play locks anymore (v2.2.100 did). The
                     session stays claimed until the idle watchdog finds
                     nothing playing ~35 minutes after the last play
                     activity, or the service is destroyed. Resuming into a
                     boundary therefore never depends on re-acquiring a lock
                     the OS may be slow to grant with the screen off. */
                  try { if (player != null && player.getPlayWhenReady()) player.pause(); } catch (Exception ignored) {}
                  pushProgress();
                  updateNotification();
              }

              /* v2.2.99: explicit play (Bluetooth PLAY key) — never a toggle.
                 Any user play also clears the focus-pause flag. */
              private void playOnlyInternal() { playOnlyInternal("internal"); }

              /* v2.2.102: see pauseOnlyInternal for the src tags. */
              private void playOnlyInternal(String src) {
                  diag("cmd play src=" + src);
                  focusPaused = false;
                  try {
                      if (player == null) return;
                      if (!player.getPlayWhenReady() && currentIndex >= 0 && currentIndex < queue.size()) {
                          /* v2.2.101: a manual resume is a new play
                             generation — any pending native floor stands
                             down NOW, instead of relying on its isPlaying()
                             guard (false while the resumed track is still
                             buffering, which is exactly the window the floor
                             could misfire in). */
                          currentPlayGen = playGen.incrementAndGet();
                          requestAudioFocus();
                          acquirePlayLocks();
                          player.play();
                      }
                  } catch (Exception ignored) {}
                  pushProgress();
                  updateNotification();
              }

              /* v2.2.99: ask the system for audio focus before (re)starting
                 playback — every play command and every track start. Never
                 blocks playback: a denied request still plays. */
              private void requestAudioFocus() {
                  try {
                      if (audioManager == null) {
                          audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      }
                      if (audioManager == null) return;
                      int result;
                      if (Build.VERSION.SDK_INT >= 26) {
                          if (focusRequest == null) {
                              android.media.AudioAttributes fAttrs = new android.media.AudioAttributes.Builder()
                                      .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                                      .setContentType(android.media.AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .build();
                              focusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                                      .setAudioAttributes(fAttrs)
                                      .setOnAudioFocusChangeListener(focusListener, main)
                                      .build();
                          }
                          result = audioManager.requestAudioFocus(focusRequest);
                      } else {
                          result = audioManager.requestAudioFocus(focusListener,
                                  AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                      if (result != AudioManager.AUDIOFOCUS_REQUEST_GRANTED) {
                          android.util.Log.i("LynxosMusic", "Audio focus not granted (" + result + ") - playing anyway");
                      }
                  } catch (Exception ignored) {}
              }

              private void abandonAudioFocus() {
                  try {
                      if (audioManager == null) return;
                      if (Build.VERSION.SDK_INT >= 26 && focusRequest != null) {
                          audioManager.abandonAudioFocusRequest(focusRequest);
                      } else {
                          audioManager.abandonAudioFocus(focusListener);
                      }
                  } catch (Exception ignored) {}
              }

              /* v2.2.100: acquire/refresh the service's own wake + Wi-Fi
                 locks (see the field comment for WHY: they cover the
                 track-boundary gap ExoPlayer's own locks don't). Called at
                 every track start and every play command. Guarded so a
                 double-acquire is impossible; a wake lock nearing its
                 30-minute safety timeout is released and re-acquired so a
                 long session never outlives it mid-song. */
              private void acquirePlayLocks() {
                  /* v2.2.101: capture held-state before/after (and any error
                     the OS throws) for the Playback log — a budget tablet
                     refusing or dropping a lock must be visible, not silent. */
                  boolean wakeBefore = false, wifiBefore = false, refreshed = false;
                  try { wakeBefore = playWakeLock != null && playWakeLock.isHeld(); } catch (Exception ignored) {}
                  try { wifiBefore = playWifiLock != null && playWifiLock.isHeld(); } catch (Exception ignored) {}
                  try {
                      if (playWakeLock == null) {
                          android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null) playWakeLock = pm.newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK, "LynxosMusic:playback");
                      }
                      if (playWakeLock != null) {
                          long now = System.currentTimeMillis();
                          if (playWakeLock.isHeld() && now - playWakeLockAt > PLAY_LOCK_TIMEOUT_MS - 5 * 60 * 1000) {
                              try { playWakeLock.release(); } catch (Exception ignored) {}
                              refreshed = true;
                          }
                          if (!playWakeLock.isHeld()) {
                              playWakeLock.acquire(PLAY_LOCK_TIMEOUT_MS);
                              playWakeLockAt = now;
                          }
                      }
                  } catch (Exception e) { diag("wake lock acquire error: " + e); }
                  try {
                      if (playWifiLock == null) {
                          android.net.wifi.WifiManager wm = (android.net.wifi.WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                          if (wm != null) playWifiLock = wm.createWifiLock(android.net.wifi.WifiManager.WIFI_MODE_FULL, "LynxosMusic:playback");
                      }
                      if (playWifiLock != null && !playWifiLock.isHeld()) playWifiLock.acquire();
                  } catch (Exception e) { diag("wifi lock acquire error: " + e); }
                  boolean wakeAfter = false, wifiAfter = false;
                  try { wakeAfter = playWakeLock != null && playWakeLock.isHeld(); } catch (Exception ignored) {}
                  try { wifiAfter = playWifiLock != null && playWifiLock.isHeld(); } catch (Exception ignored) {}
                  if (wakeAfter != wakeBefore || wifiAfter != wifiBefore) {
                      diag("locks acquired - wake " + wakeBefore + "->" + wakeAfter + " wifi " + wifiBefore + "->" + wifiAfter);
                  } else if (refreshed) {
                      diag("locks refreshed (near 30-min timeout)");
                  }
                  /* v2.2.101: claim/refresh the session and re-arm the idle
                     watchdog (see the lockSessionActive field comment). */
                  lockSessionActive = true;
                  try {
                      main.removeCallbacks(lockIdleWatchdog);
                      main.postDelayed(lockIdleWatchdog, PLAY_LOCK_WATCHDOG_MS);
                  } catch (Exception ignored) {}
              }

              /* v2.2.100: release the play locks. v2.2.101: the callers are
                 now session-end only — service destroy, or the idle
                 watchdog after ~35 idle minutes. A user pause deliberately
                 does NOT release anymore (session-scoped locks: resuming
                 into a boundary must never wait on re-acquiring them), and
                 a focus-caused pause never did. Guarded so releasing an
                 unheld lock is impossible. */
              private void releasePlayLocks() {
                  boolean wakeHeld = false, wifiHeld = false;
                  try { wakeHeld = playWakeLock != null && playWakeLock.isHeld(); } catch (Exception ignored) {}
                  try { wifiHeld = playWifiLock != null && playWifiLock.isHeld(); } catch (Exception ignored) {}
                  try { if (playWakeLock != null && playWakeLock.isHeld()) playWakeLock.release(); } catch (Exception ignored) {}
                  try { if (playWifiLock != null && playWifiLock.isHeld()) playWifiLock.release(); } catch (Exception ignored) {}
                  playWakeLockAt = 0;
                  /* v2.2.101: log the release and end the session claim. */
                  if (wakeHeld || wifiHeld) diag("locks released - wake was " + wakeHeld + " wifi was " + wifiHeld);
                  lockSessionActive = false;
                  try { main.removeCallbacks(lockIdleWatchdog); } catch (Exception ignored) {}
              }

              /* v2.2.99: the app's own audio-focus reactions (the player no
                 longer handles focus itself). Transient losses — another app's
                 short sound, a ringing call — DUCK to 20% instead of pausing,
                 so songs stop stopping-and-restarting around every
                 interruption. Only a permanent loss pauses, and a later GAIN
                 resumes ONLY that focus-caused pause (focusPaused), never a
                 pause the user made. Nothing is abandoned on a duck.
                 v2.2.105: transients no longer duck at all — ambient
                 transients on his tablet (TalkBack, notification blips)
                 fired every few seconds and pumped the volume. They are
                 logged and ignored now; only a permanent loss pauses. */
              private void handleFocusChange(int focusChange) {
                  try {
                      if (player == null) return;
                      switch (focusChange) {
                          case AudioManager.AUDIOFOCUS_LOSS:
                              /* v2.2.101: focus events go to the Playback log. */
                              diag("focus loss" + (player.getPlayWhenReady() ? " (paused)" : ""));
                              if (player.getPlayWhenReady()) {
                                  focusPaused = true;
                                  player.pause();
                                  /* v2.2.102: the focus pause is a command
                                     arrival too (src=focus). */
                                  diag("cmd pause src=focus");
                                  pushProgress();
                                  updateNotification();
                              }
                              break;
                          case AudioManager.AUDIOFOCUS_LOSS_TRANSIENT:
                              /* v2.2.105: logged and ignored — transient grabs
                                 no longer duck the volume (see the note above
                                 handleFocusChange). Nothing is touched: no
                                 volume change, no focusDucked, no pause. */
                              diag("focus transient (ignored)");
                              break;
                          case AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK:
                              diag("focus transient can-duck (ignored)");
                              break;
                          case AudioManager.AUDIOFOCUS_GAIN:
                              if (focusDucked) {
                                  focusDucked = false;
                                  player.setVolume(1.0f);
                              }
                              if (focusPaused) {
                                  focusPaused = false;
                                  player.play();
                                  /* v2.2.102: the focus resume is a command
                                     arrival too (src=focus). */
                                  diag("cmd play src=focus");
                                  pushProgress();
                                  updateNotification();
                                  diag("focus gain (resumed)");
                              } else {
                                  diag("focus gain");
                              }
                              break;
                          default:
                              break;
                      }
                  } catch (Exception ignored) {}
              }

              public void seekTo(int sec) {
                  try { if (player != null) player.seekTo(Math.max(0, sec) * 1000L); } catch (Exception ignored) {}
                  pushProgress();
              }

              public void removeAt(int index) {
                  if (index < 0 || index >= queue.size() || index == currentIndex) return;
                  queue.remove(index);
                  if (index < currentIndex) currentIndex--;
                  /* v2.2.108: keep the preload window truthful across queue
                     edits — if the appended track itself was removed, its
                     player item goes too and a fresh next is derived; if it
                     merely shifted down with everything after the removed
                     slot, its bookkeeping index shifts with it. */
                  if (preloadedIndex == index) {
                      dropPreloaded("queue edit");
                      schedulePreloadNext(currentIndex, playGen.get());
                  } else if (preloadedIndex > index) {
                      preloadedIndex--;
                  }
                  /* v2.2.110: queue edits shift banking target indices. */
                  bankContextChanged();
              }

              public void truncateAfter(int index) {
                  while (queue.size() > index + 1) queue.remove(queue.size() - 1);
                  /* v2.2.108: if the cut removed the appended track, drop
                     its player item too and re-derive a next. */
                  if (preloadedIndex > index) {
                      dropPreloaded("queue edit");
                      schedulePreloadNext(currentIndex, playGen.get());
                  }
                  /* v2.2.110: queue edits shift banking target indices. */
                  bankContextChanged();
              }

              // ---- internals ----

              private void toggleInternal() { toggleInternal("internal"); }

              /* v2.2.102: see pauseOnlyInternal for the src tags. */
              private void toggleInternal(String src) {
                  diag("cmd toggle src=" + src);
                  try {
                      if (player == null) return;
                      /* v2.2.99: decide on INTENT (getPlayWhenReady), not
                         isPlaying(). isPlaying() is false while a track is
                         buffering, so a pause press mid-buffer used to fall
                         into the play branch — "pause" that plays. Either way
                         this is a user action, so it clears the focus-pause
                         flag: focus regain must never undo the user's choice. */
                      if (player.getPlayWhenReady()) {
                          focusPaused = false;
                          /* v2.2.101: session-scoped locks — a toggle-pause
                             does NOT release the play locks (see
                             pauseOnlyInternal). */
                          player.pause();
                      } else if (currentIndex >= 0 && currentIndex < queue.size()) {
                          focusPaused = false;
                          /* v2.2.101: a manual resume bumps the play
                             generation, standing any pending native floor
                             down immediately (see playOnlyInternal). */
                          currentPlayGen = playGen.incrementAndGet();
                          requestAudioFocus();
                          acquirePlayLocks();
                          player.play();
                      }
                  } catch (Exception ignored) {}
                  pushProgress();
                  updateNotification();
              }

              private void playAtInternal(int i) { playAtInternal(i, false); }

              /* v2.2.100: fromAdvance marks plays that came from the native
                 ended-advance (advanceAfterEnded, and the native floor that
                 backs it up). Only those get the long resolve deadline and
                 the native failure floor: a button tap keeps the snappy 15s
                 deadline, and for tap plays the page's own recovery stays
                 the only recovery — nobody is stranded if a tap's resolve
                 fails, the user is right there. At a track boundary with
                 the screen off, there may be nobody awake at all. */
              private void playAtInternal(int i, boolean fromAdvance) {
                  if (player == null || i < 0 || i >= queue.size()) return;
                  /* v2.2.100: focus hygiene — a track change is a fresh
                     start. v2.2.99's focus listener could set focusPaused
                     at STATE_ENDED (playWhenReady is still true there),
                     and the flag then leaked into the NEXT track because
                     nothing cleared it here: a wake-time GAIN could play()
                     the ended player (restart, then cut off by the advance)
                     or pause/resume the new track through the stale flag.
                     A duck left over from the previous track goes with it. */
                  focusPaused = false;
                  if (focusDucked) {
                      focusDucked = false;
                      try { player.setVolume(1.0f); } catch (Exception ignored) {}
                  }
                  /* v2.2.99: a pending retry-seek belongs to one index only;
                     any other play supersedes and discards it. */
                  if (pendingSeekIndex >= 0 && pendingSeekIndex != i) { pendingSeekIndex = -1; pendingSeekMs = 0; }
                  currentIndex = i;
                  final long myGen = playGen.incrementAndGet();
                  currentPlayGen = myGen;
                  /* v2.2.108: this command owns the player window until its
                     setMediaItem lands (or it fails trying). While
                     landingPlayGen is set, an AUTO transition from the
                     previously appended preload must not adopt bookkeeping
                     — the command rebuilds the window itself (see
                     onMediaItemTransition). The claim is released at the
                     top of this play's posted completion, or by the
                     pre-resolve staleness drop below if it never posts. */
                  landingPlayGen = myGen;
                  /* v2.2.100: (re)arm the play locks for this track — they
                     are what carry the advance across the boundary gap. */
                  acquirePlayLocks();
                  final Track t = queue.get(i);
                  final int wantIndex = i;
                  final boolean adv = fromAdvance;
                  goForeground(t, true);
                  /* v2.2.98: resolve on the dedicated play thread (never stuck
                     behind prefetches), through the single-flight resolver. */
                  playExec.execute(new Runnable() {
                      @Override public void run() {
                          /* Stale queued play (user already tapped on): drop it
                             before it burns a resolve — currentIndex moved. */
                          if (wantIndex != currentIndex) {
                              /* v2.2.108: this play will never land — release
                                 the landing claim if it is still ours (a
                                 newer play has already replaced it with its
                                 own generation). */
                              if (landingPlayGen == myGen) landingPlayGen = -1;
                              return;
                          }
                          final ResolveResult rr = resolveShared(t.videoId, t.title, t.channel,
                                  adv ? ADVANCE_RESOLVE_DEADLINE_MS : RESOLVE_DEADLINE_MS);
                          main.post(new Runnable() {
                              @Override public void run() {
                                  /* v2.2.108: landed or failed — the landing
                                     claim ends here either way. This whole
                                     runnable is atomic on the main thread
                                     relative to player callbacks, so no
                                     auto-transition can slip between this
                                     release and the setMediaItem below. */
                                  if (landingPlayGen == myGen) landingPlayGen = -1;
                                  if (player == null || wantIndex != currentIndex) {
                                      /* Superseded play: drop any retry-seek queued for it. */
                                      if (pendingSeekIndex == wantIndex) { pendingSeekIndex = -1; pendingSeekMs = 0; }
                                      return;
                                  }
                                  if (rr.url == null || rr.url.isEmpty()) {
                                      /* v2.2.101: the failure lands in the
                                         Playback log with its kind. */
                                      diag("resolve failed idx=" + wantIndex + " kind="
                                              + (rr.kind == KIND_DEAD ? "dead" : "transient") + (adv ? " advance" : ""));
                                      UiListener l = ui;
                                      /* v2.1.4: let the web page try another upload
                                         of the same song before skipping it.
                                         v2.2.98: the failure kind + message go
                                         along so the page can react properly. */
                                      boolean consumed = false;
                                      if (l != null) { try { consumed = l.onTrackResolveFailed(wantIndex, rr.kind, rr.message); } catch (Exception ignored) {} }
                                      if (!consumed) {
                                          if (l != null) { try { l.onTrackError(rr.message); } catch (Exception ignored) {} }
                                          else playAtInternal(currentIndex + 1);
                                      }
                                      /* v2.2.100: native floor. "Consumed" only
                                         means the page was TOLD — pageAlive is
                                         still true with the screen off, but the
                                         page is frozen and its recovery never
                                         runs, so a boundary failure used to be
                                         a guaranteed stall until wake. If this
                                         play came from the native advance, arm
                                         the floor: after a grace period (awake
                                         JS acts first and stands the floor
                                         down via playGen the moment it starts
                                         anything), the service retries the
                                         resolve once itself, then advances on
                                         its own. JS candidates stay primary
                                         while the page is awake. */
                                      if (adv) scheduleNativeFloor(wantIndex, myGen, false, "");
                                      return;
                                  }
                                  /* v2.2.98: an alternative upload won — adopt
                                     its id in the service queue (notification
                                     + prefetch stay consistent) and tell the
                                     page so its queue/cache learn it too. */
                                  String winId = rr.resolvedVideoId;
                                  if (winId != null && !winId.isEmpty() && !winId.equals(t.videoId)) {
                                      try { queue.get(wantIndex).videoId = winId; } catch (Exception ignored) {}
                                      UiListener lr = ui;
                                      if (lr != null) { try { lr.onTrackResolved(wantIndex, winId); } catch (Exception ignored) {} }
                                  }
                                  boolean adoptedStart = false;
                                  boolean skipAdopted = false;
                                  try {
                                      /* v2.2.109: skip adopts preload. If THIS
                                         play's target is the very track sitting
                                         appended in the window — same index,
                                         same videoId (the transition handler's
                                         identity rule), and this play's resolve
                                         returned the appended item's own URL —
                                         and the play is fresh (no retry-seek is
                                         pending for the target: a retry resumes
                                         a broken track from a fresh item, so it
                                         must keep today's path), then
                                         setMediaItem would throw away the
                                         banked audio and cold-start the same
                                         song — the 29s stall a Next press hit
                                         in the v2.2.108 device test. Instead,
                                         seek to the window item in place:
                                         seekTo updates the player's current
                                         item synchronously on this thread, so
                                         the crossing is proven right here (the
                                         index flips to 1) and THIS path adopts
                                         the bookkeeping — the AUTO handler
                                         stays AUTO-only (a seek crossing
                                         reports reason SEEK, which it ignores),
                                         so the boundary still has exactly one
                                         driver. The crossing is recorded with
                                         this play's generation, so an older
                                         in-flight play landing later adopts
                                         instead of restarting, exactly as after
                                         an AUTO crossing. Any check failing
                                         falls through to the untouched paths
                                         below. */
                                      try {
                                          skipAdopted = pendingSeekIndex != wantIndex
                                                  && preloadedIndex == wantIndex
                                                  && preloadedVideoId != null && t.videoId != null
                                                  && preloadedVideoId.equals(t.videoId)
                                                  && preloadedUrl != null && !preloadedUrl.isEmpty()
                                                  && preloadedUrl.equals(rr.url)
                                                  && player.getMediaItemCount() == 2
                                                  && player.getCurrentMediaItemIndex() == 0
                                                  && player.getPlaybackState() != Player.STATE_ENDED
                                                  && player.getPlaybackState() != Player.STATE_IDLE;
                                      } catch (Exception ignored) {}
                                      if (skipAdopted) {
                                          player.seekTo(1, 0);
                                          boolean crossed = false;
                                          try { crossed = player.getCurrentMediaItemIndex() == 1; } catch (Exception ignored) {}
                                          if (crossed) {
                                              /* The appended item is current
                                                 now. Leave the state exactly
                                                 what the AUTO handler leaves
                                                 behind a crossing, BEFORE any
                                                 further player call: preload
                                                 bookkeeping cleared (the item
                                                 is no longer "next"), the
                                                 skipped-from item dropped, the
                                                 crossing recorded against this
                                                 play. (currentIndex and
                                                 currentPlayGen already name
                                                 this play — they were set at
                                                 playAtInternal entry.) */
                                              preloadedIndex = -1; preloadedVideoId = ""; preloadedUrl = "";
                                              autoAdvancedIndex = wantIndex;
                                              autoAdvancedGen = myGen;
                                              try { if (player.getMediaItemCount() > 1) player.removeMediaItem(0); } catch (Exception ignored) {}
                                              diag("skip adopts preload idx=" + wantIndex);
                                              /* v2.2.99: every track start
                                                 (re)requests audio focus under
                                                 the app's own focus management. */
                                              requestAudioFocus();
                                              try { player.play(); } catch (Exception ignored) {}
                                          } else {
                                              /* The seek did not cross (the
                                                 player's state raced us) —
                                                 today's paths below own this
                                                 play after all. */
                                              skipAdopted = false;
                                          }
                                      }
                                      /* v2.2.108: adopt, don't restart. If a
                                         preload auto-transition already started
                                         THIS track — it became current after
                                         this play was entered (autoAdvancedGen
                                         is newer than this play's generation),
                                         the player is holding the very URL just
                                         resolved, and it is mid-playback rather
                                         than ended/idle — then the boundary has
                                         already been driven by the player, and
                                         setMediaItem would restart a playing
                                         song and double-drive it. Just make
                                         sure it is playing. A command entered
                                         after the crossing (a deliberate re-tap
                                         of the playing song) has a NEWER
                                         generation and takes the normal restart
                                         path below, exactly as before. */
                                      if (!skipAdopted) {
                                          try {
                                              adoptedStart = wantIndex == autoAdvancedIndex
                                                      && autoAdvancedGen > myGen
                                                      && player.getPlaybackState() != Player.STATE_ENDED
                                                      && player.getPlaybackState() != Player.STATE_IDLE
                                                      && rr.url.equals(currentMediaUrl());
                                          } catch (Exception ignored) {}
                                          if (adoptedStart) {
                                              /* v2.2.99: every track start
                                                 (re)requests audio focus under the
                                                 app's own focus management. */
                                              requestAudioFocus();
                                              try { player.play(); } catch (Exception ignored) {}
                                          } else {
                                              player.setMediaItem(MediaItem.fromUri(rr.url));
                                              player.prepare();
                                              /* v2.2.99: every track start (re)requests
                                                 audio focus under the app's own focus
                                                 management. */
                                              requestAudioFocus();
                                              player.play();
                                              /* v2.2.108: setMediaItem replaced the
                                                 whole window — any appended preload
                                                 is physically gone with it. */
                                              preloadedIndex = -1; preloadedVideoId = ""; preloadedUrl = "";
                                          }
                                      }
                                      /* v2.2.99: an error retry resumes where
                                         the track broke instead of restarting
                                         from 0; the pending seek is consumed
                                         (or discarded) here. */
                                      if (pendingSeekIndex == wantIndex) {
                                          if (pendingSeekMs > 0) {
                                              try { player.seekTo(pendingSeekMs); } catch (Exception ignored) {}
                                          }
                                          pendingSeekIndex = -1;
                                          pendingSeekMs = 0;
                                      }
                                  } catch (Throwable th) {
                                      UiListener l = ui;
                                      if (l != null) { try { l.onTrackError("Playback failed."); } catch (Exception ignored) {} }
                                      return;
                                  }
                                  updateNotification();
                                  UiListener l = ui;
                                  if (l != null) { try { l.onTrackChanged(wantIndex); } catch (Exception ignored) {} }
                                  /* v2.2.101: a started track closes the
                                     boundary story the "track ended" entry
                                     opened. */
                                  diag("started idx=" + wantIndex + (skipAdopted ? " (skip-adopted)" : (adoptedStart ? " (auto-adopted)" : (adv ? " (advance)" : ""))));
                                  /* v2.1.7: while this song plays, resolve the
                                     next one in the background so skipping is instant. */
                                  /* v2.2.38: Prefetch next 3 tracks aggressively for instant skipping. */
                                  prefetchNext(wantIndex + 1);
                                  prefetchNext(wantIndex + 2);
                                  prefetchNext(wantIndex + 3);
                                  /* v2.2.108: append the effective next track
                                     to the player so its audio downloads
                                     during this one (see schedulePreloadNext).
                                     Uses the freshest generation: if a
                                     transition superseded this play while it
                                     resolved, that crossing already rolled the
                                     window and this call re-derives/no-ops
                                     against the live state. */
                                  schedulePreloadNext(wantIndex, playGen.get());
                                  /* v2.2.110: a track start is a banking
                                     context change — retarget the worker to
                                     the new position's next two tracks
                                     (covers commanded plays and the
                                     skip-adopt branch alike). */
                                  bankContextChanged();
                              }
                          });
                      }
                  });
              }

              /* v2.2.100: the native failure floor. scheduleNativeFloor is
                 called when an advance-originated play fails (resolve
                 failure in playAtInternal, or playback-error exhaustion in
                 onPlayerError) AFTER the failure has been handed to the
                 page as usual. After a grace delay (NATIVE_FLOOR_GRACE_MS —
                 long enough for awake JS to act first), the floor checks
                 whether playback progression for that index is still
                 unresolved and, if so, retries the resolve ONCE itself and
                 either plays the track or advances natively to the next
                 index. It stands down the moment anything newer owns
                 progression:
                   - playGen moved on (any newer play started — the page's
                     candidates/retries, a user tap, another advance);
                   - a newer failure superseded this one (failureSeq);
                   - this failure already got its single engagement
                     (nativeFloorEngagedSeq);
                   - something is audibly playing (no dead air to fix).
                 Each floor advance goes through playAtInternal(next, true),
                 so a queue of failures walks forward one index per failure
                 — always progress, terminating at the end of the queue. */
              private void scheduleNativeFloor(final int index, final long gen, final boolean freshResolve, final String failedUrl) {
                  /* v2.2.101: the floor's decisions go to the Playback log —
                     armed / engaged / stood down (and why) is exactly the
                     evidence a boundary-stall report needs. */
                  diag("floor armed idx=" + index + (freshResolve ? " (fresh resolve)" : ""));
                  final long fseq = failureSeq.incrementAndGet();
                  final String fUrl = (failedUrl != null) ? failedUrl : "";
                  main.postDelayed(new Runnable() {
                      @Override public void run() {
                          runNativeFloor(index, gen, fseq, freshResolve, fUrl);
                      }
                  }, NATIVE_FLOOR_GRACE_MS);
              }

              private void runNativeFloor(final int index, final long gen, final long fseq, final boolean freshResolve, final String failedUrl) {
                  try {
                      if (player == null) return;
                      if (playGen.get() != gen) { diag("floor stand-down idx=" + index + " (newer play)"); return; }
                      if (failureSeq.get() != fseq) { diag("floor stand-down idx=" + index + " (superseded)"); return; }
                      if (nativeFloorEngagedSeq == fseq) { diag("floor stand-down idx=" + index + " (already engaged)"); return; }
                      if (player.isPlaying()) { diag("floor stand-down idx=" + index + " (already playing)"); return; }
                      if (index < 0 || index >= queue.size()) { diag("floor stand-down idx=" + index + " (bad index)"); return; }
                      final Track ft = queue.get(index);
                      if (ft == null) return;
                      nativeFloorEngagedSeq = fseq;
                      diag("floor engaged idx=" + index);
                      if (ft.videoId == null || ft.videoId.isEmpty()) { advanceNativeFloor(index); return; }
                      final Track retryTrack = ft;
                      playExec.execute(new Runnable() {
                          @Override public void run() {
                              if (playGen.get() != gen) return;
                              ResolveResult rr2 = null;
                              try {
                                  /* Error-origin floors force a TRULY fresh
                                     resolve — the cached URL is the one that
                                     just failed on the player. */
                                  if (freshResolve) clearCachedUrl(retryTrack.videoId);
                                  rr2 = resolveShared(retryTrack.videoId, retryTrack.title, retryTrack.channel, ADVANCE_RESOLVE_DEADLINE_MS);
                              } catch (Throwable ignored) {}
                              final ResolveResult fr2 = rr2;
                              main.post(new Runnable() {
                                  @Override public void run() {
                                      if (player == null) return;
                                      if (playGen.get() != gen) return;
                                      if (player.isPlaying()) return;
                                      /* For error-origin floors, a "fresh"
                                         resolve that hands back the very URL
                                         that failed counts as a failure —
                                         playing it would just error again. */
                                      boolean usable = fr2 != null && fr2.url != null && !fr2.url.isEmpty()
                                              && (failedUrl.isEmpty() || !fr2.url.equals(failedUrl));
                                      if (usable) {
                                          /* Adopt a winning alternative id the
                                             same way the normal play path does,
                                             so the replay below hits its cache
                                             entry instead of re-resolving. */
                                          String winId = fr2.resolvedVideoId;
                                          if (winId != null && !winId.isEmpty() && !winId.equals(retryTrack.videoId)) {
                                              try { queue.get(index).videoId = winId; } catch (Exception ignored) {}
                                              UiListener lr = ui;
                                              if (lr != null) { try { lr.onTrackResolved(index, winId); } catch (Exception ignored) {} }
                                          }
                                          /* v2.2.102: a floor-driven play is a
                                             command arrival (src=floor). */
                                          diag("cmd play src=floor");
                                          playAtInternal(index, true);
                                      } else {
                                          advanceNativeFloor(index);
                                      }
                                  }
                              });
                          }
                      });
                  } catch (Exception ignored) {}
              }

              /* The floor's own advance: the next index the way
                 advanceAfterEnded computes it, WITHOUT the repeat-all wrap
                 (and without repeat-one's replay — the track just failed).
                 A floor chain must always make progress and terminate at
                 the end of the queue rather than loop a dead queue forever;
                 when the page wakes, its own repeat/shuffle policy resumes
                 control from wherever playback stopped. */
              private void advanceNativeFloor(int failedIndex) {
                  if (failedIndex + 1 < queue.size()) {
                      diag("floor advancing idx=" + failedIndex + " -> " + (failedIndex + 1));
                      /* v2.2.102: a floor-driven play is a command arrival
                         (src=floor). */
                      diag("cmd play src=floor");
                      playAtInternal(failedIndex + 1, true);
                  } else {
                      diag("floor at queue end idx=" + failedIndex);
                  }
              }

              /* v2.1.7: resolve the next track's audio URL ahead of time.
                 v2.2.98: passes the track's real title/artist (the Python
                 alternative search needs them — it used to get "" and could
                 never help a prefetch), skips known-dead ids, shares the
                 single-flight resolver, and abandons when the playhead has
                 moved on and the target fell out of the next-3 window. */
              private void prefetchNext(final int i) {
                  if (i < 0 || i >= queue.size()) return;
                  final Track pt;
                  try { pt = queue.get(i); } catch (Exception e) { return; }
                  final String vid = pt.videoId;
                  if (vid == null || vid.isEmpty()) return;
                  try {
                      if (getCachedUrl(vid) != null) return;
                  } catch (Exception ignored) {}
                  if (isDeadId(vid)) return;
                  final long gen = playGen.get();
                  final String pTitle = pt.title != null ? pt.title : "";
                  final String pChannel = pt.channel != null ? pt.channel : "";
                  bg.execute(new Runnable() {
                      @Override public void run() {
                          try {
                              /* Stale-prefetch abandon: the playhead moved since
                                 this was queued AND the target is no longer in
                                 the next-3 window — don't burn a resolve on it. */
                              if (gen != playGen.get() && (i <= currentIndex || i > currentIndex + 3)) return;
                              if (i < 0 || i >= queue.size()) return;
                              Track now = queue.get(i);
                              if (now == null || !vid.equals(now.videoId)) return;
                              if (getCachedUrl(vid) != null) return;
                              resolveShared(vid, pTitle, pChannel);
                          } catch (Throwable ignored) {}
                      }
                  });
              }

              /* v2.2.108: the effective next index under the service's own
                 advance policy — the same computation advanceAfterEnded
                 performs (sequential; repeat-all wraps; repeat-one replays
                 the same track). Returns -1 when there is no next to
                 preload. Repeat-one ALWAYS returns -1 here: its replay is
                 a fresh resolve + setMediaItem per repetition (today's
                 behavior, incl. picking up a rotated URL), and appending
                 the same track as a second item would let a stale URL
                 auto-play instead. Page shuffle order is NOT known to the
                 service (the page's playNext owns manual skips); the
                 native boundary advance has always been sequential too,
                 so preloading the sequential next matches exactly the
                 track a natural boundary would have started. */
              private int effectiveNextIndex(int curIdx) {
                  if (repeatMode == 2) return -1;
                  if (curIdx < 0 || curIdx >= queue.size()) return -1;
                  if (curIdx + 1 < queue.size()) return curIdx + 1;
                  if (repeatMode == 1 && !queue.isEmpty() && curIdx != 0) return 0;
                  return -1;
              }

              /* v2.2.108: append the effective next track's media item to
                 the player so ExoPlayer downloads its audio while the
                 current track plays (the LoadControl's 90s total buffer is
                 shared across the window, so the next track banks up to a
                 full cushion by the boundary). The URL goes through
                 resolveShared — the same single-flight, video-gated,
                 diag-logged choke point as every played URL; a failed
                 resolve simply leaves the window empty and the boundary
                 takes today's STATE_ENDED path. The append itself lands
                 on the main thread and re-validates everything it derived
                 before resolving: same play generation, same current
                 track, empty window, no command landing, mode unchanged,
                 and the queue slot still holds the track it resolved (by
                 videoId identity — the winning alternative id is adopted
                 into the queue first, exactly like the play path). */
              private void schedulePreloadNext(final int curIdx, final long gen) {
                  try {
                      if (player == null) return;
                      if (player.getPlaybackState() == Player.STATE_ENDED) return;
                      if (preloadedIndex != -1) return;
                      final int target = effectiveNextIndex(curIdx);
                      if (target < 0) return;
                      final Track tt = queue.get(target);
                      if (tt == null || tt.videoId == null || tt.videoId.isEmpty()) return;
                      final String wantVid = tt.videoId;
                      bg.execute(new Runnable() {
                          @Override public void run() {
                              ResolveResult rr = null;
                              try { rr = resolveShared(tt.videoId, tt.title, tt.channel); } catch (Throwable ignored) {}
                              final ResolveResult fr = rr;
                              main.post(new Runnable() {
                                  @Override public void run() {
                                      try {
                                          if (player == null || fr == null || fr.url == null || fr.url.isEmpty()) return;
                                          if (playGen.get() != gen) return;
                                          if (currentIndex != curIdx) return;
                                          if (preloadedIndex != -1) return;
                                          if (landingPlayGen != -1) return;
                                          if (effectiveNextIndex(curIdx) != target) return;
                                          if (target < 0 || target >= queue.size()) return;
                                          Track now = queue.get(target);
                                          if (now == null || !wantVid.equals(now.videoId)) return;
                                          /* Adopt a winning alternative id
                                             the same way the play path does,
                                             so notifications, retries and the
                                             page stay consistent. */
                                          String winId = fr.resolvedVideoId;
                                          if (winId != null && !winId.isEmpty() && !winId.equals(now.videoId)) {
                                              try { queue.get(target).videoId = winId; } catch (Exception ignored) {}
                                              UiListener lr = ui;
                                              if (lr != null) { try { lr.onTrackResolved(target, winId); } catch (Exception ignored) {} }
                                              now = queue.get(target);
                                          }
                                          player.addMediaItem(MediaItem.fromUri(fr.url));
                                          preloadedIndex = target;
                                          preloadedVideoId = (now != null && now.videoId != null) ? now.videoId : wantVid;
                                          preloadedUrl = fr.url;
                                          diag("preload next idx=" + target);
                                      } catch (Exception ignored) {}
                                  }
                              });
                          }
                      });
                  } catch (Exception ignored) {}
              }

              /* v2.2.108: remove the appended preload item from the player
                 (found by its URL, skipping the current item — robust to
                 index drift) and clear its bookkeeping. Called when the
                 derivation inputs change under it: repeat mode changed, or
                 a queue edit removed the track it points at. */
              private void dropPreloaded(String why) {
                  if (preloadedIndex < 0) return;
                  int idx = preloadedIndex;
                  String url = preloadedUrl;
                  preloadedIndex = -1; preloadedVideoId = ""; preloadedUrl = "";
                  try {
                      if (player != null && url != null && !url.isEmpty()) {
                          int cur = player.getCurrentMediaItemIndex();
                          for (int k = 0; k < player.getMediaItemCount(); k++) {
                              if (k == cur) continue;
                              MediaItem mi = player.getMediaItemAt(k);
                              if (mi != null && mi.localConfiguration != null
                                      && url.equals(String.valueOf(mi.localConfiguration.uri))) {
                                  player.removeMediaItem(k);
                                  break;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  diag("preload dropped idx=" + idx + " (" + why + ")");
              }

              /* v2.2.39: Direct Python call with automatic alternatives.
                 If the primary video ID fails, Python searches for alternative
                 versions of the same song. This is the permanent skip fix.
                 v2.2.98: returns the full ResolveResult — Python reports the
                 winning videoId (resolved_video_id) and an error_kind, parsed
                 as real JSON instead of string-scraping just the URL. */
              private ResolveResult getStreamUrlViaPythonDirect(String videoId, String title, String artist) {
                  ResolveResult out = new ResolveResult();
                  out.resolvedVideoId = videoId;
                  try {
                      if (!com.chaquo.python.Python.isStarted()) {
                          com.chaquo.python.Python.start(new com.chaquo.python.android.AndroidPlatform(MusicService.this));
                      }
                      com.chaquo.python.PyObject mod = com.chaquo.python.Python.getInstance().getModule("ytm_bridge");
                      if (mod != null) {
                          com.chaquo.python.PyObject r = mod.callAttr("get_playable_stream",
                              title != null ? title : "",
                              artist != null ? artist : "",
                              videoId);
                          String json = r.toString();
                          if (json != null) {
                              try {
                                  org.json.JSONObject o = new org.json.JSONObject(json);
                                  String url = o.optString("url", "");
                                  if (!url.isEmpty() && url.startsWith("http")) {
                                      out.url = url;
                                      out.kind = KIND_OK;
                                      String wid = o.optString("resolved_video_id", "");
                                      if (wid.isEmpty()) wid = o.optString("videoId", "");
                                      out.resolvedVideoId = !wid.isEmpty() ? wid : videoId;
                                      if (o.has("alternative")) {
                                          android.util.Log.i("LynxosMusic", "Used alternative version for " + title);
                                      }
                                      return out;
                                  }
                                  out.kind = "dead".equals(o.optString("error_kind", "")) ? KIND_DEAD : KIND_TRANSIENT;
                                  out.message = o.optString("error", "");
                                  android.util.Log.w("LynxosMusic", "Python stream error for " + videoId + ": " + json);
                              } catch (Exception je) {
                                  out.message = "Unparseable Python result";
                              }
                          }
                      }
                  } catch (Exception e) {
                      android.util.Log.w("LynxosMusic", "Direct Python failed for " + videoId, e);
                      out.message = String.valueOf(e.getMessage());
                  }
                  return out;
              }
              /* v2.2.42: Speed fix - NewPipe FIRST (fast 1-2s), yt-dlp second (robust 3-5s).
                 NewPipe just parses the page; yt-dlp does full extraction.
                 v2.2.98: returns a structured ResolveResult instead of
                 throwing a generic ExtractionException that erased WHY the
                 resolve failed — an explicit unavailable/private/removed
                 signal from either layer classifies the failure DEAD. */
              private ResolveResult resolveAudioUrl(String videoId, String title, String artist) {
                  ResolveResult out = new ResolveResult();
                  out.resolvedVideoId = videoId;
                  // Try NewPipeExtractor first (fast)
                  Exception npErr = null;
                  try {
                      StreamExtractor ex = ServiceList.YouTube.getStreamExtractor("https://www.youtube.com/watch?v=" + videoId);
                      ex.fetchPage();
                      List<AudioStream> streams = ex.getAudioStreams();
                      /* v2.2.105: lighter streams — his connection delivers
                         ~35 KB/s in bursts, and the heaviest stream (this
                         loop used to take the max bitrate) starved the
                         player into 8-10s stalls. Prefer the highest
                         average bitrate at or under ~96 kbps; if every
                         known bitrate is above the cap, take the lightest
                         known one; if no bitrate is known, the first
                         usable stream (the pre-cap pick). The cap never
                         fails a resolve. */
                      AudioStream best = null;
                      AudioStream lightest = null;
                      AudioStream firstUsable = null;
                      int bestKbps = 0;
                      int lightestKbps = 0;
                      for (AudioStream s : streams) {
                          if (s.getDeliveryMethod() != DeliveryMethod.PROGRESSIVE_HTTP) continue;
                          String u = "";
                          try { u = s.getUrl(); } catch (Exception ignored) {}
                          if (u == null || u.isEmpty()) continue;
                          if (firstUsable == null) firstUsable = s;
                          int br = 0;
                          try { br = s.getAverageBitrate(); } catch (Exception ignored) {}
                          /* v2.2.107: normalize the raw getter value to
                             kbps ONCE — on this NewPipe build it returns
                             kbps (device log: abr=160 for a ~160 kbps
                             stream), but the v2.2.105 cap compared the raw
                             value against 96000 as if it were bps, so the
                             cap never engaged and the heaviest stream
                             always won. A raw value over 2000 is treated
                             as bps and converted, so the comparisons
                             below are correct under either convention. */
                          int kbps = br > 2000 ? br / 1000 : br;
                          if (kbps > 0) {
                              if (lightest == null || kbps < lightestKbps) { lightest = s; lightestKbps = kbps; }
                              if (kbps <= 96 && (best == null || kbps > bestKbps)) { best = s; bestKbps = kbps; }
                          }
                      }
                      /* The chosen stream's normalized kbps, so the resolve
                         diag line below reads true. Fallback picks
                         (firstUsable / the non-progressive scan below)
                         never had a measured bitrate — 0 = unknown there,
                         exactly as the raw getter printed for them. */
                      int chosenKbps = bestKbps;
                      if (best == null) { best = lightest; chosenKbps = lightestKbps; }
                      if (best == null) best = firstUsable;
                      if (best == null) {
                          /* No progressive stream: any audio stream beats none
                             (this list is audio-only by construction). */
                          for (AudioStream s : streams) {
                              String u = "";
                              try { u = s.getUrl(); } catch (Exception ignored) {}
                              if (u != null && !u.isEmpty()) { best = s; break; }
                          }
                      }
                      if (best != null) {
                          /* v2.2.106: this line is a diag() now — in v2.2.105
                             it went to Log.i (logcat) only, so the picked
                             weight never reached the Settings Playback log
                             Justin can actually read back.
                             v2.2.107: prints chosenKbps (normalized), not
                             the raw getter value, so the logged weight is
                             real kbps. */
                          diag("resolve newpipe abr=" + chosenKbps + " " + describeStreamUrl(best.getUrl()));
                          out.url = best.getUrl();
                          out.kind = KIND_OK;
                          return out;
                      }
                  } catch (Exception e) {
                      npErr = e;
                      android.util.Log.w("LynxosMusic", "NewPipe failed for " + videoId + ", trying yt-dlp", e);
                  }
                  // Fall back to Python yt-dlp with automatic alternatives (robust)
                  ResolveResult py = null;
                  try { py = getStreamUrlViaPythonDirect(videoId, title, artist); }
                  catch (Exception e) { android.util.Log.w("LynxosMusic", "Python yt-dlp failed for " + videoId, e); }
                  if (py != null && py.url != null && !py.url.isEmpty()) {
                      android.util.Log.i("LynxosMusic", "Got stream URL via Python yt-dlp for " + videoId);
                      /* v2.2.106: the Python producer's Playback-log line —
                         which door a heavy stream came through is the whole
                         point of the log. */
                      diag("resolve python " + describeStreamUrl(py.url));
                      return py;
                  }
                  /* Both layers failed — classify, preserving the real reason. */
                  int kind = KIND_TRANSIENT;
                  String msg = "";
                  if (py != null && py.kind == KIND_DEAD) { kind = KIND_DEAD; msg = py.message; }
                  else if (npErr != null && isUnavailableError(npErr)) { kind = KIND_DEAD; msg = String.valueOf(npErr.getMessage()); }
                  else if (py != null && py.message != null && !py.message.isEmpty()) { msg = py.message; }
                  else if (npErr != null) { msg = String.valueOf(npErr.getMessage()); }
                  out.kind = kind;
                  out.message = (msg == null) ? "" : msg;
                  return out;
              }

              private List<Track> parseTracks(String json) {
                  List<Track> out = new ArrayList<>();
                  try {
                      JSONArray arr = new JSONArray(json);
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          Track t = new Track();
                          t.videoId = o.optString("videoId", "");
                          t.title = o.optString("title", t.videoId);
                          t.channel = o.optString("channel", "");
                          t.thumb = o.optString("thumb", "");
                          /* v2.1.2: keep every track, even ones whose videoId
                             is not resolved yet. Dropping them misaligns the
                             service queue with the JS queue, so Next/Previous
                             hit the wrong song (or nothing). A blank id fails
                             cleanly into the skip path. */
                          out.add(t);
                      }
                  } catch (Exception ignored) {}
                  return out;
              }

              private void pushProgress() {
                  UiListener l = ui;
                  if (l == null || player == null) return;
                  long pos = 0, dur = 0;
                  boolean playing = false;
                  try {
                      pos = Math.max(0, player.getCurrentPosition());
                      dur = player.getDuration();
                      playing = player.isPlaying();
                  } catch (Exception ignored) {}
                  if (dur == C.TIME_UNSET || dur < 0) dur = 0;
                  try { l.onProgress((int) (pos / 1000), (int) (dur / 1000), playing); } catch (Exception ignored) {}
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          NotificationChannel ch = new NotificationChannel(CH_ID, "Music playback", NotificationManager.IMPORTANCE_LOW);
                          ch.setDescription("Lynxos Music playback controls");
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.createNotificationChannel(ch);
                      } catch (Exception ignored) {}
                  }
              }

              private PendingIntent svcAction(String action) {
                  Intent i = new Intent(this, MusicService.class).setAction(action);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getService(this, action.hashCode(), i, flags);
              }

              private Notification buildNotification(Track t, boolean loading) {
                  boolean playing = false;
                  try { playing = player != null && player.isPlaying(); } catch (Exception ignored) {}
                  String title = (t != null && t.title != null && !t.title.isEmpty()) ? t.title : "Lynxos Music";
                  String artist = (t != null && t.channel != null) ? t.channel : "";
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) b = new Notification.Builder(this, CH_ID);
                  else b = new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                   .setContentTitle(loading ? "Loading…" : title)
                   .setContentText(artist)
                   .setOngoing(true)
                   .setOnlyAlertOnce(true);
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_previous, "Previous", svcAction(ACT_PREV)).build());
                  b.addAction(new Notification.Action.Builder(
                      playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                      playing ? "Pause" : "Play", svcAction(ACT_TOGGLE)).build());
                  b.addAction(new Notification.Action.Builder(android.R.drawable.ic_media_next, "Next", svcAction(ACT_NEXT)).build());
                  try {
                      Intent open = new Intent(this, MainActivity.class);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                      b.setContentIntent(PendingIntent.getActivity(this, 0, open, flags));
                  } catch (Exception ignored) {}
                  return b.build();
              }

              private void goForeground(Track t, boolean loading) {
                  try {
                      Notification n = buildNotification(t, loading);
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIF_ID, n);
                      }
                  } catch (Exception ignored) {}
              }

              private void updateNotification() {
                  Track t = (currentIndex >= 0 && currentIndex < queue.size()) ? queue.get(currentIndex) : null;
                  if (t == null) return;
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(NOTIF_ID, buildNotification(t, false));
                  } catch (Exception ignored) {}
              }

              /** Minimal HTTP downloader for the NewPipe extractor. */
              static class ExtractorDownloader extends Downloader {
                  @Override
                  public Response execute(Request request) throws IOException {
                      HttpURLConnection conn = (HttpURLConnection) new URL(request.url()).openConnection();
                      try {
                          conn.setRequestMethod(request.httpMethod());
                      } catch (Exception e) {
                          throw new IOException("Bad HTTP method");
                      }
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(15000);
                      conn.setInstanceFollowRedirects(true);
                      Map<String, List<String>> headers = request.headers();
                      if (headers != null) {
                          for (Map.Entry<String, List<String>> e : headers.entrySet()) {
                              if (e.getKey() == null) continue;
                              for (String v : e.getValue()) {
                                  try { conn.addRequestProperty(e.getKey(), v); } catch (Exception ignored) {}
                              }
                          }
                      }
                      byte[] body = request.dataToSend();
                      if (body != null && body.length > 0) {
                          conn.setDoOutput(true);
                          conn.getOutputStream().write(body);
                      }
                      int code = conn.getResponseCode();
                      InputStream is = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      StringBuilder sb = new StringBuilder();
                      if (is != null) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line).append('\n');
                          br.close();
                      }
                      String latestUrl;
                      try { latestUrl = conn.getURL().toString(); } catch (Exception e) { latestUrl = request.url(); }
                      Map<String, List<String>> respHeaders = conn.getHeaderFields();
                      conn.disconnect();
                      return new Response(code, String.valueOf(code), respHeaders, sb.toString(), latestUrl);
                  }
              }
          }

          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lynxos-music-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}+${{ inputs.version_code }}
          name: Lynxos Music v${{ inputs.version_name }}+${{ inputs.version_code }}
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/release/app-release.apk
