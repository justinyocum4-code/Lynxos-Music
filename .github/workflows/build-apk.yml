                      Long t = deadIds.get(videoId);
                      if (t == null) return false;
                      if (System.currentTimeMillis() - t < DEAD_TTL_MS) return true;
                      deadIds.remove(videoId);
                  } catch (Exception ignored) {}
                  return false;
              }
              private void markDeadId(String videoId) {
