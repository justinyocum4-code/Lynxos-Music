              /* v2.2.98: single-flight resolve with an aggregate deadline.
                 The first caller for a videoId starts ONE resolve on
                 resolveExec; everyone else (play path included) waits on the
                 same Future, capped at RESOLVE_DEADLINE_MS. The resolve task
                 itself writes the URL cache, so a waiter that times out
                 doesn't lose the result — the orphan still populates the
                 cache when it lands. Timeouts classify TRANSIENT.
                 v2.2.100: two semantic fixes. (1) The in-flight entry is now
                 removed ONLY by the owning resolve task itself when it
                 completes. A waiter whose deadline expired used to evict it
                 in its finally block while the resolve was still running,
                 so the next caller started a DUPLICATE resolve (serialized
                 on the Python GIL) and the orphan's late success was never
                 re-consumed. Now a later caller joins the existing future.
                 (2) The deadline is a parameter: the tap path keeps 15s;
                 the native ended-advance (and its floor) passes 60s and, if
                 even that expires, re-checks the URL cache once before
                 declaring failure — the resolve may have just landed. */
              private ResolveResult resolveShared(final String videoId, final String title, final String artist) {
                  return resolveShared(videoId, title, artist, RESOLVE_DEADLINE_MS);
              }
              private ResolveResult resolveShared(final String videoId, final String title, final String artist, final long deadlineMs) {
                  ResolveResult out = new ResolveResult();
                  if (videoId == null || videoId.isEmpty()) { out.message = "No video id"; return out; }
                  String cached = getCachedUrl(videoId);
                  if (cached != null && !cached.isEmpty()) {
                      out.url = cached; out.resolvedVideoId = videoId; out.kind = KIND_OK;
                      return out;
                  }
                  if (isDeadId(videoId)) {
                      out.kind = KIND_DEAD; out.message = "Upload known to be gone";
                      return out;
                  }
                  final java.util.concurrent.atomic.AtomicReference<java.util.concurrent.FutureTask<ResolveResult>> selfRef =
                          new java.util.concurrent.atomic.AtomicReference<java.util.concurrent.FutureTask<ResolveResult>>();
                  java.util.concurrent.Callable<ResolveResult> task = new java.util.concurrent.Callable<ResolveResult>() {
                      @Override public ResolveResult call() {
                          try {
                              ResolveResult r = resolveAudioUrl(videoId, title, artist);
                              try {
                                  if (r != null && r.kind == KIND_OK && r.url != null && !r.url.isEmpty()) {
                                      /* Cache under the WINNING id — an alternative
                                         upload's URL must not be filed under the
                                         dead id that was originally asked for. */
                                      String wid = (r.resolvedVideoId != null && !r.resolvedVideoId.isEmpty()) ? r.resolvedVideoId : videoId;
                                      putCachedUrl(wid, r.url);
                                  }
                              } catch (Exception ignored) {}
                              return r;
                          } finally {
                              /* v2.2.100: owner-only removal — the task
                                 itself unregisters when it completes, never
                                 a timed-out waiter (see method comment). */
                              try { inFlight.remove(videoId, selfRef.get()); } catch (Exception ignored) {}
                          }
                      }
                  };
                  java.util.concurrent.FutureTask<ResolveResult> ft =
                          new java.util.concurrent.FutureTask<ResolveResult>(task);
                  selfRef.set(ft);
                  java.util.concurrent.Future<ResolveResult> existing = inFlight.putIfAbsent(videoId, ft);
                  boolean owner = (existing == null);
                  java.util.concurrent.Future<ResolveResult> f = owner ? ft : existing;
                  if (owner) {
                      try { resolveExec.execute(ft); }
                      catch (Exception e) {
                          /* The task will never run, so it can never remove
                             its own entry — the submitter cleans up instead. */
                          inFlight.remove(videoId, ft);
                          out.message = String.valueOf(e);
                          return out;
                      }
                  }
                  try {
                      ResolveResult r = f.get(deadlineMs, java.util.concurrent.TimeUnit.MILLISECONDS);
                      if (r != null) out = r;
                  } catch (java.util.concurrent.TimeoutException te) {
                      /* Not cancelled: the task is still running and will
                         fill the cache when it lands. The long-deadline
                         (advance) caller gets one cache re-check before
                         giving up — the resolve may have JUST landed. */
                      String late = null;
                      if (deadlineMs > RESOLVE_DEADLINE_MS) {
                          try { late = getCachedUrl(videoId); } catch (Exception ignored) {}
                      }
                      if (late != null && !late.isEmpty()) {
                          out.url = late; out.resolvedVideoId = videoId; out.kind = KIND_OK;
                      } else {
                          out.kind = KIND_TRANSIENT; out.message = "Resolve timed out";
                      }
                  } catch (Exception e) {
                      out.kind = KIND_TRANSIENT; out.message = String.valueOf(e);
                  }
                  if (out.kind == KIND_DEAD) markDeadId(videoId);
                  return out;
              }
