              public void onBackPressed() {
                  // The app is a single page: WebView history is empty, so the
                  // back button must consult the JS UI state (full player,
                  // open playlist, current tab) via lmHandleBack().
                  if (backArmed) { backArmed = false; super.onBackPressed(); return; }
                  final Activity self = this;
                  try {
                      webView.evaluateJavascript(
                          "(function(){ try { if (window.lmHandleBack) return window.lmHandleBack(); } catch(e){} return 'exit'; })()",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String value) {
                                  String v = value == null ? "exit" : value.replace("\"", "").trim();
                                  if ("exit".equals(v)) {
                                      backArmed = true;
                                      self.onBackPressed();
                                  }
                                  // else: JS consumed the back press
                              }
                          });
                  } catch (Exception e) {
                      super.onBackPressed();
                  }
              }

              // TV remote media keys: next skips forward, previous restarts
              // the song (or jumps back when pressed twice). Routed into the
              // page's lmRemote* hooks so one code path drives both the
              // on-screen buttons and the remote.
              // v2.2.99: play/pause is deliberately NOT intercepted here any
              // more. The media session in MusicService is the single route
              // for play/pause; having this activity-level hook ALSO toggle
              // made one Bluetooth press pause and then instantly re-play
              // (~1s apart, as the two routes raced).
              @Override
              public boolean dispatchKeyEvent(android.view.KeyEvent event) {
                  if (event.getAction() == android.view.KeyEvent.ACTION_DOWN) {
                      String js = null;
                      switch (event.getKeyCode()) {
                          case android.view.KeyEvent.KEYCODE_MEDIA_NEXT:
                          case android.view.KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                              js = "(function(){ try { if (window.lmRemoteNext) return window.lmRemoteNext(); } catch(e){} return 'exit'; })()";
                              break;
                          case android.view.KeyEvent.KEYCODE_MEDIA_PREVIOUS:
                          case android.view.KeyEvent.KEYCODE_MEDIA_REWIND:
                              js = "(function(){ try { if (window.lmRemotePrev) return window.lmRemotePrev(); } catch(e){} return 'exit'; })()";
                              break;
                      }
                      if (js != null) {
                          try { webView.evaluateJavascript(js, null); } catch (Exception ignored) {}
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }
          }

